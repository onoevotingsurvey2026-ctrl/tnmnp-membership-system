<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMNP Membership System V5</title>

<style>
body{
margin:0;
font-family:Arial;
background:#eef2f7;
}

/* SIDEBAR */
.sidebar{
position:fixed;
left:0;
top:0;
width:220px;
height:100%;
background:#0b3d91;
color:#fff;
padding-top:20px;
}

.sidebar h2{
text-align:center;
font-size:18px;
}

.sidebar button{
width:100%;
padding:12px;
border:none;
background:transparent;
color:#fff;
text-align:left;
cursor:pointer;
font-size:14px;
}

.sidebar button:hover{
background:rgba(255,255,255,0.2);
}

/* MAIN */
.main{
margin-left:220px;
padding:20px;
}

/* SECTION */
.section{
display:none;
}

.active-section{
display:block;
}

/* FORM */
input{
width:100%;
padding:10px;
margin:6px 0;
box-sizing:border-box;
}

button{
padding:10px;
border:none;
cursor:pointer;
border-radius:5px;
}

.btn{
background:#0b3d91;
color:#fff;
}

.btn-green{
background:green;
color:#fff;
}

/* CARD DESIGN */
.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
max-width:400px;
margin-top:15px;
border-left:6px solid #0b3d91;
}

.card h3{
margin:0;
color:#0b3d91;
}

.badge{
display:inline-block;
padding:5px 10px;
background:#0b3d91;
color:#fff;
border-radius:5px;
font-size:12px;
margin-top:10px;
}

/* TOP BAR */
.topbar{
background:#0b3d91;
color:#fff;
padding:15px;
border-radius:10px;
margin-bottom:15px;
}

</style>
</head>

<body>

<div class="sidebar">
<h2>TMNP SYSTEM</h2>

<button onclick="show('register')">📌 Register</button>
<button onclick="show('members')">👥 Members</button>
<button onclick="show('reports')">📊 Reports</button>
</div>

<div class="main">

<div class="topbar">
TMNP Membership System V5 - Professional Portal
</div>

<!-- REGISTER -->
<div id="register" class="section active-section">

<h3>Membership Registration</h3>

<input id="name" placeholder="Name">
<input id="phone" placeholder="Phone">
<input id="voterid" placeholder="Voter ID">
<input id="email" placeholder="Email">
<input id="address" placeholder="Address">
<input id="district" placeholder="District">
<input type="file" id="photo">

<button class="btn-green" onclick="save()">Submit</button>

<div id="cardArea"></div>

</div>

<!-- MEMBERS -->
<div id="members" class="section">

<h3>Members List</h3>
<div id="membersList"></div>

</div>

<!-- REPORTS -->
<div id="reports" class="section">

<h3>Reports</h3>

<button class="btn" onclick="downloadExcel()">Download Excel</button>

</div>

</div>

<script>

let data = JSON.parse(localStorage.getItem("tmnp") || "[]");

/* NAV */
function show(tab){

document.querySelectorAll(".section").forEach(s=>{
s.classList.remove("active-section");
});

document.getElementById(tab).classList.add("active-section");

if(tab==="members") renderMembers();
}

/* SAVE */
function save(){

let name = document.getElementById("name").value;
let phone = document.getElementById("phone").value;

if(!name || !phone){
alert("Name & Phone required");
return;
}

let file = document.getElementById("photo").files[0];
let reader = new FileReader();

reader.onload = function(){

let m = {
id:"TMNP-"+Date.now(),
name:name,
phone:phone,
voterid:document.getElementById("voterid").value,
email:document.getElementById("email").value,
address:document.getElementById("address").value,
district:document.getElementById("district").value,
photo:reader.result || ""
};

data.push(m);
localStorage.setItem("tmnp", JSON.stringify(data));

renderCard(m);
reset();
};

if(file){
reader.readAsDataURL(file);
}else{
reader.onload();
}
}

/* CARD DESIGN */
function renderCard(m){

document.getElementById("cardArea").innerHTML = `
<div class="card">
<h3>TMNP MEMBER CARD</h3>
<div class="badge">${m.id}</div>
<p><b>Name:</b> ${m.name}</p>
<p><b>Phone:</b> ${m.phone}</p>
<p><b>District:</b> ${m.district}</p>
</div>
`;
}

/* MEMBERS */
function renderMembers(){

let html="";

data.forEach(m=>{
html += `
<div class="card">
<h3>${m.name}</h3>
<p>${m.phone}</p>
<p>${m.district}</p>
</div>
`;
});

document.getElementById("membersList").innerHTML =
html || "No members found";
}

/* RESET */
function reset(){
["name","phone","voterid","email","address","district"].forEach(id=>{
document.getElementById(id).value="";
});

document.getElementById("photo").value="";
}

/* EXCEL */
function downloadExcel(){

let rows=[["ID","Name","Phone","VoterID","Email","Address","District"]];

data.forEach(d=>{
rows.push([d.id,d.name,d.phone,d.voterid,d.email,d.address,d.district]);
});

let csv = rows.map(r=>r.join(",")).join("\n");

let blob = new Blob([csv],{type:"text/csv"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="TMNP_REPORT.csv";
a.click();
}

</script>

</body>
</html>
