<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Membership Registration</title>
</head>

<body>

<h2>Membership Registration</h2>

<form id="membershipForm">

  <input type="text" id="name" placeholder="Name" required>
  <br><br>

  <input type="tel" id="phone" placeholder="Phone" required>
  <br><br>

  <input type="email" id="email" placeholder="Email" required>
  <br><br>

  <textarea id="address" placeholder="Address" required></textarea>
  <br><br>

  <!-- Auto ID (safe display) -->
  <input type="text" id="membershipId" readonly placeholder="Auto ID">
  <br><br>

  <button type="submit">Submit</button>

</form>

<!-- Firebase (ONLY ONCE) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
  // 🔥 YOUR EXISTING FIREBASE CONFIG (KEEP SAME)
  // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBJaHZfEyg4pID4jmPSyVxEbDhta4VY0kY",
  authDomain: "tnmnp-membership-system.firebaseapp.com",
  databaseURL: "https://tnmnp-membership-system-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "tnmnp-membership-system",
  storageBucket: "tnmnp-membership-system.firebasestorage.app",
  messagingSenderId: "616857466202",
  appId: "1:616857466202:web:0fb4fae39e938ec0edef63",
  measurementId: "G-Q7RYMTMLC7"
};

  // Initialize ONLY ONCE
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // Auto ID preview
  function generateID() {
    return "TNMNP-" + Date.now();
  }

  document.getElementById("membershipId").value = generateID();

  // SUBMIT HANDLER (FIXED + SAFE)
  document.getElementById("membershipForm").addEventListener("submit", async function(e){
    e.preventDefault();

    const data = {
      name: document.getElementById("name").value,
      phone: document.getElementById("phone").value,
      email: document.getElementById("email").value,
      address: document.getElementById("address").value,
      membershipId: generateID(),
      timestamp: new Date().toISOString()
    };

    try {
      await db.ref("members").push(data);

      alert("✅ Registration Successful!\nID: " + data.membershipId);

      this.reset();

      // regenerate ID after reset
      document.getElementById("membershipId").value = generateID();

    } catch (err) {
      console.error(err);
      alert("❌ Firebase Save Failed. Check Rules / Connection");
    }
  });

</script>

</body>
</html>
