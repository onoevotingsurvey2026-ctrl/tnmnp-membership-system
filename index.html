```html
<!DOCTYPE html>
<html lang="ta">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>
TMNP Membership Form
</title>

<style>

body{
margin:0;
padding:20px;
font-family:Arial;
background:#f2f2f2;
}

.container{
max-width:800px;
margin:auto;
background:#fff;
padding:20px;
border-radius:10px;
}

input,
textarea,
button{
width:100%;
padding:12px;
margin-top:8px;
margin-bottom:12px;
box-sizing:border-box;
}

button{
background:#0b5ed7;
color:#fff;
border:none;
cursor:pointer;
}

.row{
display:flex;
gap:10px;
}

@media(max-width:700px){

.row{
flex-direction:column;
}

}

</style>

</head>

<body>

<div class="container">

<h2>
TMNP Membership Form
</h2>

<label>
Registration ID
</label>

<input
id="regId"
readonly>


<label>
Name
</label>

<input
id="name">


<div class="row">

<div style="flex:1">

<label>
Mobile
</label>

<input
id="phone">

</div>

<div style="flex:1">

<label>
Voter ID
</label>

<input
id="voter">

</div>

</div>


<label>
Email
</label>

<input
id="email">


<label>
Address
</label>

<textarea
id="address">
</textarea>


<label>
Member Photo
</label>

<input
id="photo"
type="file"
accept="image/*">


<button
onclick="submitMembership()">

Submit Membership

</button>

</div>

<script
type="module"
src="script.js">
</script>

</body>

</html>
```
