<!DOCTYPE html>
<html lang="ta">

<head>

<title>TMNP Membership Form</title>

<style>

    font-family:Arial;
    background:#f2f2f2;

.container{
    max-width:900px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:10px;
}

/* HEADER */
.header{
    text-align:center;
    padding:10px;

}

.header img{
    width:100px;

    margin:10px;
}

.title{

    margin-top:10px;
}

/* FORM */
.form-group{
    margin:10px 0;
}

    display:block;
    font-weight:bold;
}

input{
    width:100%;
    padding:8px;
    margin-top:5px;

</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">

        <!-- LOGO (EMBEDDED IMAGE) -->

        <div class="title">
            Political Party Membership Form<br>
            அரசியல் கட்சி உறுப்பினர் சேர்க்கை படிவம்
        </div>

        <h3>Join Now As Membership</h3>

        <h2>TMNP – Tamilnadu Makkal Nalvazhvu Periyakkam</h2>
        <h3>தமிழ்நாடு மக்கள் நல்வாழ்வு பேரியக்கம்</h3>

        <!-- BANNER IMAGE (EMBEDDED) -->

    </div>

        <label>Name</label>
        <input type="text">
    </div>

    <div class="form-group">
        <label>Mobile</label>
        <input type="text">
    </div>

    <div class="form-group">
        <label>Email</label>
        <input type="text">
    </div>

</div>

</html>
