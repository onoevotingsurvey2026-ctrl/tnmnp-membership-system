<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMNP Membership System</title>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<!-- REQUIRED LIBRARIES -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<link rel="stylesheet" href="gold-style.css">
</head>

<body>

<header>
<div class="header-title">
TMNP - தமிழ்நாடு மக்கள் நல்வாழ்வு பேரியக்கம் - நிரந்தர உறுப்பினர் அடையாளம்
</div>

<div class="header-sub">
TAMILNADU MAKKAL NALVAZHVU PERIYAKKAM - PERMANENT MEMBERSHIP IDENTITY ☁️
</div>

<div class="header-sub">Leader: N. RAMAN</div>
<div class="header-sub">📧 tnmnp2025@gmail.com</div>

<div id="liveLoc" class="header-sub">📍 Location: Not Activated</div>
</header>

<div class="container">

<div class="left">

<h3>Membership Registration</h3>

<input id="name" placeholder="Name">
<input id="phone" placeholder="Phone">
<input id="voterid" placeholder="Voter ID">
<input id="email" placeholder="Email">
<input id="address" placeholder="Address">
<input id="district" placeholder="District">
<input type="file" id="photo">

<button class="btn-green" onclick="getLocation()">📍 Get Location</button>
<button class="btn" onclick="saveMember()">Submit</button>
<button class="btn-blue" onclick="downloadPDF()">🪪 Download Card</button>

</div>

<div class="right" id="cardArea">
<div id="idCard">No Member Yet</div>
</div>

</div>

<!-- V6 JS FILES -->
<script src="storage.js"></script>
<script src="core.js"></script>
<script src="ui.js"></script>
<script src="qr.js"></script>
<script src="pdf.js"></script>
<script src="admin.js"></script>

<script>

/* LOCATION */
function getLocation(){
navigator.geolocation.getCurrentPosition(pos=>{
document.getElementById("liveLoc").innerHTML =
"📍 LIVE: " + pos.coords.latitude + " , " + pos.coords.longitude;
});
}

</script>

</body>
</html>
