<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TMNP Membership System</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f2f2f2;
}

/* HEADER */
.header{
    background:#0b3d91;
    color:white;
    padding:15px;
    text-align:center;
    position:relative;
}

/* LOGO LEFT */
.fixed-logo{
    position:absolute;
    top:10px;
    left:10px;
    width:70px;
    height:70px;
    object-fit:cover;
    border-radius:8px;
    background:white;
}

/* LEADER RIGHT */
.fixed-leader{
    position:absolute;
    top:10px;
    right:10px;
    width:70px;
    height:70px;
    object-fit:cover;
    border-radius:8px;
    background:white;
}

/* MAIN CONTAINER */
.container{
    max-width:900px;
    margin:20px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

/* FORM */
input, select, textarea{
    width:100%;
    padding:10px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:5px;
}

/* BUTTON */
button{
    background:#0b3d91;
    color:white;
    padding:10px 15px;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#062a66;
}

/* FOOTER */
.footer{
    text-align:center;
    padding:15px;
    margin-top:20px;
    background:#ddd;
}

/* MOBILE FIX */
@media(max-width:600px){
    .fixed-logo, .fixed-leader{
        width:50px;
        height:50px;
    }
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

    <!-- LOGO -->
    <img class="fixed-logo"
         src="logo.png"
         alt="TMNP Logo"
         onerror="this.style.display='none'">

    <!-- TITLE -->
    <h2>TMNP Membership System</h2>
    <p>தமிழ்நாடு மக்கள் நல்வாழ்வு பேரியக்கம்</p>

    <!-- LEADER -->
    <img class="fixed-leader"
         src="leader.jpg"
         alt="Leader"
         onerror="this.style.display='none'">

</div>

<!-- MAIN FORM -->
<div class="container">

    <h3>Membership Form</h3>

    <label>Name</label>
    <input type="text" placeholder="Enter Name">

    <label>Mobile</label>
    <input type="text" placeholder="Enter Mobile">

    <label>Address</label>
    <textarea placeholder="Enter Address"></textarea>

    <label>District</label>
    <input type="text">

    <label>State</label>
    <input type="text">

    <button type="button">Submit</button>

</div>

<!-- FOOTER -->
<div class="footer">
    © TMNP Membership System
</div>

</body>
</html>
