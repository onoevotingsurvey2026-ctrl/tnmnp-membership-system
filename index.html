<!DOCTYPE html>
<html>
<head>
  <title>TMNP Admin Dashboard</title>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#f4f6f9;
    }

    .header{
      background:#2e7d32;
      color:white;
      padding:15px;
      text-align:center;
      font-size:20px;
    }

    .container{
      padding:20px;
    }

    .card{
      background:white;
      padding:15px;
      margin-bottom:15px;
      border-radius:10px;
      box-shadow:0 2px 6px rgba(0,0,0,0.1);
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .info{
      line-height:1.6;
    }

    .btn{
      padding:8px 12px;
      border:none;
      border-radius:6px;
      cursor:pointer;
      margin-left:5px;
    }

    .approve{
      background:#2e7d32;
      color:white;
    }

    .reject{
      background:#c62828;
      color:white;
    }

    .status{
      font-weight:bold;
    }

  </style>
</head>

<body>

<div class="header">
  TMNP ADMIN DASHBOARD
</div>

<div class="container" id="adminList">

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js"></script>

<script>
// FIREBASE CONFIG
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBJaHZfEyg4pID4jmPSyVxEbDhta4VY0kY",
  authDomain: "tnmnp-membership-system.firebaseapp.com",
  projectId: "tnmnp-membership-system",
  storageBucket: "tnmnp-membership-system.firebasestorage.app",
  messagingSenderId: "616857466202",
  appId: "1:616857466202:web:0fb4fae39e938ec0edef63",
  measurementId: "G-Q7RYMTMLC7"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// LOAD DATA
firebase.database().ref("members").on("value", (snapshot) => {

    let data = snapshot.val();
    let html = "";

    for(let id in data){

        let m = data[id];

        html += `
        <div class="card">

          <div class="info">
            <div><b>${m.name}</b></div>
            <div>ID: ${m.id}</div>
            <div class="status">Status: ${m.status}</div>
          </div>

          <div>
            <button class="btn approve" onclick="approve('${m.id}')">Approve</button>
            <button class="btn reject" onclick="reject('${m.id}')">Reject</button>
          </div>

        </div>
        `;
    }

    document.getElementById("adminList").innerHTML = html;
});

// APPROVE
function approve(id){
    firebase.database().ref("members/" + id).update({
        status: "approved"
    });
}

// REJECT
function reject(id){
    firebase.database().ref("members/" + id).update({
        status: "rejected"
    });
}

</script>

</body>
</html>
