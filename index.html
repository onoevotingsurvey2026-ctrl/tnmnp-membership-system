<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMNP Membership System V7</title>

<style>
body{
margin:0;
font-family:Arial;
background:#eef2f7;
}

/* HEADER */
header{
background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b);
color:#000;
text-align:center;
padding:15px;
font-weight:bold;
}

/* MAIN GRID (EQUAL HEIGHT) */
.container{
display:flex;
gap:20px;
max-width:1100px;
margin:auto;
padding:20px;
align-items:stretch;
}

/* LEFT FORM */
.left{
flex:1;
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
display:flex;
flex-direction:column;
}

/* RIGHT CARD */
.right{
flex:1;
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
display:flex;
align-items:center;
justify-content:center;
}

/* INPUT */
input{
width:100%;
padding:10px;
margin:6px 0;
border:1px solid #ccc;
border-radius:5px;
}

/* BUTTON */
button{
padding:10px;
border:none;
cursor:pointer;
border-radius:5px;
margin-top:8px;
}

.btn{
background:#b8860b;
color:#fff;
width:100%;
}

/* CARD DESIGN */
.card{
width:100%;
max-width:350px;
background:#fff;
border-radius:15px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
border-top:8px solid #b8860b;
text-align:center;
}

.card-header{
background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b);
padding:10px;
font-weight:bold;
}

.card-body{
padding:15px;
}

.card img{
width:90px;
height:90px;
border-radius:50%;
border:3px solid #b8860b;
margin-top:10px;
}

.badge{
background:#b8860b;
color:#fff;
padding:5px 10px;
display:inline-block;
border-radius:5px;
margin-top:5px;
font-size:12px;
}

.small{
font-size:13px;
margin:4px 0;
}

/* RESPONSIVE */
@media(max-width:900px){
.container{
flex-direction:column;
}
}
</style>
</head>

<body>

<header>
TAMILNADU MAKKAL NALVAZHVU PERIYAKKAM - MEMBERSHIP SYSTEM
</header>

<div class="container">

<!-- LEFT SIDE FORM -->
<div class="left">

<h3>Membership Registration</h3>

<input id="name" placeholder="Name">
<input id="phone" placeholder="Phone">
<input id="voterid" placeholder="Voter ID">
<input id="email" placeholder="Email">
<input id="address" placeholder="Address">
<input id="district" placeholder="District">
<input type="file" id="photo">

<button class="btn" onclick="save()">Submit</button>

</div>

<!-- RIGHT SIDE CARD -->
<div class="right" id="cardArea">

<div style="color:#777;">Submit after registration to generate card</div>

</div>

</div>

<script>

let data = JSON.parse(localStorage.getItem("tmnp") || "[]");
let currentLocation = null;

/* SAVE */
function save(){

let name = document.getElementById("name").value;
let phone = document.getElementById("phone").value;

if(!name || !phone){
alert("Name & Phone required");
return;
}

let file = document.getElementById("photo").files[0];
let reader = new FileReader();

reader.onload = function(){

let m = {
id:"TMNP-"+Date.now(),
name,
phone,
voterid:document.getElementById("voterid").value,
email:document.getElementById("email").value,
address:document.getElementById("address").value,
district:document.getElementById("district").value,
photo:reader.result || ""
};

data.push(m);
localStorage.setItem("tmnp", JSON.stringify(data));

renderCard(m);
reset();
};

if(file){
reader.readAsDataURL(file);
}else{
reader.onload();
}
}

/* CARD */
function renderCard(m){

document.getElementById("cardArea").innerHTML = `
<div class="card">

<div class="card-header">
TMNP MEMBER CARD
</div>

<div class="card-body">

<img src="${m.photo || ''}">

<div class="badge">${m.id}</div>

<div class="small"><b>Name:</b> ${m.name}</div>
<div class="small"><b>Phone:</b> ${m.phone}</div>
<div class="small"><b>Voter ID:</b> ${m.voterid}</div>
<div class="small"><b>Email:</b> ${m.email}</div>
<div class="small"><b>Address:</b> ${m.address}</div>
<div class="small"><b>District:</b> ${m.district}</div>

</div>
</div>
`;
}

/* RESET */
function reset(){
["name","phone","voterid","email","address","district"].forEach(id=>{
document.getElementById(id).value="";
});

document.getElementById("photo").value="";
}

</script>

</body>
</html>
