<!DOCTYPE html>
<html lang="ta">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TMNP Membership Form</title>

<style>
body{
font-family:Arial;
background:#f2f2f2;
margin:0;
padding:20px;
}

.container{
max-width:1100px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

.header{
display:flex;
justify-content:space-between;
gap:20px;
border-bottom:2px solid #000;
padding-bottom:20px;
}

.left-logo,.right-photo{
width:140px;
text-align:center;
}

.left-logo img,.right-photo img{
width:130px;
height:130px;
border:1px solid #ccc;
border-radius:8px;
object-fit:cover;
}

.center-info{flex:1;text-align:center;}

.membership-title{font-size:24px;font-weight:bold;}

.join-line{
color:#0b5ed7;
font-weight:bold;
display:block;
margin-top:5px;
}

.party-title{
font-size:28px;
font-weight:bold;
margin-top:15px;
}

.header-columns{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
margin-top:20px;
}

.column-box{
width:380px;
padding:15px;
border:1px solid #ccc;
border-radius:10px;
background:#fafafa;
}

input,textarea,button{
width:100%;
padding:12px;
margin:10px 0;
box-sizing:border-box;
}

.row{display:flex;gap:10px;}

button{
background:#0b5ed7;
border:none;
color:white;
cursor:pointer;
}

.footer{text-align:center;margin-top:30px;}

@media(max-width:900px){
.header{flex-direction:column;}
.row{flex-direction:column;}
.column-box{width:100%;}
}
</style>

</head>

<body>

<div class="container">

<div class="header">

<div class="left-logo">
<img id="logoPreview">
<input type="file" accept="image/*" onchange="loadLogo(event)">
</div>

<div class="center-info">

<div class="membership-title">
Political Party Membership Form
<br>அரசியல் கட்சி உறுப்பினர் சேர்க்கை படிவம்
<span class="join-line">Join Now As Membership</span>
</div>

<div class="party-title">
TMNP – Tamilnadu Makkal Nalvazhvu Periyakkam
</div>

<div>தமிழ்நாடு மக்கள் நல்வாழ்வு பேரியக்கம்</div>

</div>

<div class="right-photo">
<img id="leaderPreview">
<input type="file" accept="image/*" onchange="loadLeader(event)">
</div>

</div>

<h3>Registration ID</h3>
<input id="regId" readonly>

<input id="name" placeholder="Member Name">

<div class="row">
<input id="phone" placeholder="Mobile Number">
<input id="voter" placeholder="Voter ID">
</div>

<input id="email" placeholder="Email">
<textarea placeholder="Address"></textarea>

<button onclick="submitMembership()">Submit Membership</button>
<button onclick="location.href='admin.html'">Admin Dashboard</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig={
apiKey:"AIzaSyBJaHZfEyg4pID4jmPSyVxEbDhta4VY0kY",
authDomain:"tnmnp-membership-system.firebaseapp.com",
databaseURL:"https://tnmnp-membership-system-default-rtdb.firebaseio.com",
projectId:"tnmnp-membership-system",
storageBucket:"tnmnp-membership-system.firebasestorage.app",
messagingSenderId:"616857466202",
appId:"1:616857466202:web:0fb4fae39e938ec0edef63"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

/* ✅ FINAL AUTO ID */
function generateID(){
const rand = Math.floor(1000 + Math.random() * 9000);
const time = Date.now().toString().slice(-6);
return "TMNP-" + time + rand;
}

document.getElementById("regId").value = generateID();

/* ✅ FIXED SUBMIT FUNCTION */
window.submitMembership = function () {

const id = document.getElementById("regId").value;
const name = document.getElementById("name").value;
const phone = document.getElementById("phone").value;
const voter = document.getElementById("voter").value;
const email = document.getElementById("email").value;
const address = document.querySelector("textarea").value;

if (!name || !phone) {
alert("Name and Mobile required!");
return;
}

set(ref(db, "members/" + id), {
id: id,
name: name,
mobile: phone,
voter: voter,
email: email,
address: address,
createdAt: new Date().toISOString()
})
.then(() => {

alert("Saved Successfully\n\n" + id);

/* regenerate ID */
document.getElementById("regId").value = generateID();

/* clear form */
document.getElementById("name").value = "";
document.getElementById("phone").value = "";
document.getElementById("voter").value = "";
document.getElementById("email").value = "";
document.querySelector("textarea").value = "";

});

}

window.loadLogo=function(e){
logoPreview.src=URL.createObjectURL(e.target.files[0]);
}

window.loadLeader=function(e){
leaderPreview.src=URL.createObjectURL(e.target.files[0]);
}

</script>

</body>
</html>
