<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Party Membership Form</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f2f2f2;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
  background:white;
  border-bottom:2px solid #ccc;
}

.side{
  width:120px;
  text-align:center;
}

.side img{
  width:80px;
  height:80px;
  object-fit:cover;
  border-radius:10px;
  border:1px solid #aaa;
}

.center{
  flex:1;
  text-align:center;
}

/* FORM */
.container{
  width:80%;
  margin:20px auto;
  background:white;
  padding:20px;
  border-radius:10px;
}

input, button{
  width:100%;
  padding:10px;
  margin:8px 0;
}

/* MAP */
#map{
  height:150px;
  background:#ddd;
  margin-top:10px;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

  <!-- LEFT LOGO -->
  <div class="side">
    <img id="logoPreview">
    <input type="file" accept="image/*" onchange="loadLogo(event)">
  </div>

  <!-- CENTER -->
  <div class="center">
    <h2>PARTY MEMBERSHIP FORM</h2>
    <p id="partyAddress">No.9, Gomathipuram, Chennai, Tamilnadu</p>
    <div id="map">Live Google Map</div>
  </div>

  <!-- RIGHT LEADER -->
  <div class="side">
    <img id="leaderPreview">
    <input type="file" accept="image/*" onchange="loadLeader(event)">
  </div>

</div>

<!-- FORM -->
<div class="container">

<form>

<input type="text" id="name" placeholder="Name">
<input type="text" id="phone" placeholder="Phone">
<input type="text" id="regno" placeholder="Membership ID" readonly>

<button type="submit">Submit</button>

</form>

<!-- QR -->
<div id="reader"></div>

</div>

<!-- QR LIBRARY -->
<script src="https://unpkg.com/html5-qrcode"></script>

<script>

/* IMAGE UPLOAD */
function loadLogo(event){
  document.getElementById("logoPreview").src =
  URL.createObjectURL(event.target.files[0]);
}

function loadLeader(event){
  document.getElementById("leaderPreview").src =
  URL.createObjectURL(event.target.files[0]);
}

/* REG ID AUTO GENERATE */
function generateRegID(){
  let id = localStorage.getItem("regid") || 1000;
  id++;
  localStorage.setItem("regid", id);
  document.getElementById("regno").value = "MBR" + id;
}

/* FORM SUBMIT */
document.querySelector("form").addEventListener("submit", function(e){
  e.preventDefault();
  generateRegID();
  alert("Form Submitted Successfully");
});

/* QR SCANNER */
function startQR(){
  let scanner = new Html5Qrcode("reader");

  Html5Qrcode.getCameras().then(devices => {
    if(devices.length){
      scanner.start(
        devices[0].id,
        { fps: 10, qrbox: 250 },
        (text) => {
          alert("QR: " + text);
          scanner.stop();
        }
      );
    }
  });
}

/* AUTO START QR */
startQR();

</script>

</body>
</html>
