<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Membership Form</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f4f4f4;
}

/* HEADER CONTAINER */
.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:white;
    padding:15px;
    border-bottom:3px solid #0a7d3b;
}

/* LEFT PHOTO */
.left img{
    width:120px;
    height:120px;
    object-fit:cover;
    border-radius:10px;
    border:2px solid #ccc;
}

/* CENTER PARTY NAME */
.center{
    text-align:center;
    flex:1;
}

.center h1{
    margin:0;
    font-size:22px;
    color:#0a7d3b;
}

.center p{
    margin:5px 0 0;
    font-size:14px;
}

/* RIGHT LOGO */
.right img{
    width:120px;
    height:120px;
    object-fit:contain;
}

/* FORM BODY */
.form{
    max-width:800px;
    margin:auto;
    background:white;
    padding:20px;
}

input, textarea{
    width:100%;
    padding:10px;
    margin-top:10px;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

    <!-- LEFT IMAGE -->
    <div class="left">
        <img src="/mnt/data/file_000000009d247207a7862d30f9525400" alt="Profile Photo">
    </div>

    <!-- CENTER TEXT -->
    <div class="center">
        <h1>TAMILNADU MAKKAL NALVAZHVU PERIYAKKAM</h1>
        <p>Membership Registration Form</p>
    </div>

    <!-- RIGHT LOGO -->
    <div class="right">
        <img src="/mnt/data/file_00000000dff471faa32560a54f83bbc6" alt="Party Logo">
    </div>

</div>

<!-- FORM BODY -->
<div class="form">
    <h3>Personal Details</h3>

    <input type="text" placeholder="Full Name">
    <input type="text" placeholder="Mobile Number">
    <input type="text" placeholder="Address">
    <textarea placeholder="Remarks"></textarea>

</div>

</body>
</html>
