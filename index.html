<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMNP Membership System V5</title>

<style>
body{
margin:0;
font-family:Arial;
background:#eef2f7;
}

/* HEADER */
header{
background:#0b3d91;
color:#fff;
padding:15px;
text-align:center;
}

header h2{
margin:0;
}

.header-info{
font-size:13px;
margin-top:5px;
line-height:1.5;
}

/* MAIN LAYOUT */
.container{
max-width:1100px;
margin:auto;
padding:20px;
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

/* FORM */
.form-box{
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

input{
width:100%;
padding:10px;
margin:6px 0;
border:1px solid #ccc;
border-radius:5px;
}

button{
padding:10px;
border:none;
cursor:pointer;
border-radius:5px;
}

.btn{
background:#0b3d91;
color:#fff;
width:100%;
}

.btn-green{
background:green;
color:#fff;
width:100%;
}

/* CARD */
.card-box{
display:flex;
justify-content:center;
}

.card{
width:350px;
background:#fff;
border-radius:15px;
overflow:hidden;
box-shadow:0 8px 20px rgba(0,0,0,0.15);
border-top:8px solid #0b3d91;
}

.card-header{
background:#0b3d91;
color:#fff;
text-align:center;
padding:10px;
font-weight:bold;
}

.card-body{
padding:15px;
text-align:center;
}

.card img{
width:90px;
height:90px;
border-radius:50%;
object-fit:cover;
border:3px solid #0b3d91;
margin-bottom:10px;
}

.badge{
background:#0b3d91;
color:#fff;
padding:5px 10px;
display:inline-block;
border-radius:5px;
font-size:12px;
margin:5px 0;
}

p{
margin:4px 0;
font-size:14px;
}

.location-box{
font-size:12px;
color:#444;
margin-top:5px;
}
</style>
</head>

<body>

<!-- HEADER -->
<header>
<h2>TAMILNADU MAKKAL NALVAZHVU PERIYAKKAM</h2>

<div class="header-info">
📍 No.9, 2nd Cross Street, Gomathipuram, Thiruninravur, Tamilnadu<br>
🌐 https://onoevotingsurvey2026-ctrl.github.io/tnmnp-membership-system/<br>
📧 tnmnp2025@gmail.com | 📱 +91 8939324309
</div>
</header>

<div class="container">

<!-- FORM -->
<div class="form-box">

<h3>Membership Registration</h3>

<input id="name" placeholder="Name">
<input id="phone" placeholder="Phone">
<input id="voterid" placeholder="Voter ID">
<input id="email" placeholder="Email">
<input id="address" placeholder="Address">
<input id="district" placeholder="District">
<input type="file" id="photo">

<button class="btn-green" onclick="getLocation()">📍 Get Location</button>

<p id="locText">Location not added</p>

<button class="btn" onclick="save()">Submit</button>

</div>

<!-- CARD -->
<div class="card-box">

<div id="cardArea">
<div class="card">
<div class="card-header">TMNP MEMBER CARD</div>
<div class="card-body">
<p>No Data Yet</p>
</div>
</div>
</div>

</div>

</div>

<script>

let data = JSON.parse(localStorage.getItem("tmnp") || "[]");
let currentLocation = null;

/* LOCATION */
function getLocation(){
navigator.geolocation.getCurrentPosition(pos=>{
currentLocation = {
lat: pos.coords.latitude,
lng: pos.coords.longitude
};

document.getElementById("locText").innerHTML =
"Lat: " + currentLocation.lat + "<br>Lng: " + currentLocation.lng;
});
}

/* SAVE */
function save(){

let name = document.getElementById("name").value;
let phone = document.getElementById("phone").value;

if(!name || !phone){
alert("Name & Phone required");
return;
}

let file = document.getElementById("photo").files[0];
let reader = new FileReader();

reader.onload = function(){

let m = {
id:"TMNP-"+Date.now(),
name:name,
phone:phone,
voterid:document.getElementById("voterid").value,
email:document.getElementById("email").value,
address:document.getElementById("address").value,
district:document.getElementById("district").value,
photo:reader.result || "",
location: currentLocation
};

data.push(m);
localStorage.setItem("tmnp", JSON.stringify(data));

renderCard(m);
reset();
};

if(file){
reader.readAsDataURL(file);
}else{
reader.onload();
}
}

/* CARD RENDER */
function renderCard(m){

document.getElementById("cardArea").innerHTML = `
<div class="card">
<div class="card-header">TMNP MEMBER CARD</div>

<div class="card-body">

<img src="${m.photo || ''}">

<div class="badge">${m.id}</div>

<p><b>Name:</b> ${m.name}</p>
<p><b>Phone:</b> ${m.phone}</p>
<p><b>Email:</b> ${m.email}</p>
<p><b>District:</b> ${m.district}</p>

<div class="location-box">
<b>Latitude:</b> ${m.location?.lat || 'Not Found'}<br>
<b>Longitude:</b> ${m.location?.lng || 'Not Found'}
</div>

</div>
</div>
`;
}

/* RESET */
function reset(){

["name","phone","voterid","email","address","district"].forEach(id=>{
document.getElementById(id).value="";
});

document.getElementById("photo").value="";
document.getElementById("locText").innerHTML="Location not added";
currentLocation = null;
}

</script>

</body>
</html>
