<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<title>TNMNP Membership System</title>

<link rel="stylesheet" href="style.css">

<style>
body{
  font-family: Arial;
  background:#f2f2f2;
  margin:0;
  padding:20px;
}

.container{
  max-width:700px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:10px;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
  text-align:center;
}

/* HEADER */
.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:2px solid #000;
  padding-bottom:10px;
  margin-bottom:15px;
}

.logo-box img{
  width:90px;
  height:90px;
  object-fit:cover;
  border:1px solid #ccc;
}

.title h2{
  margin:0;
  color:#1b5e20;
}

.title p{
  margin:5px 0;
}

/* INPUT */
input, button{
  width:100%;
  padding:12px;
  margin-top:10px;
  box-sizing:border-box;
}

button{
  background:#1b5e20;
  color:white;
  border:none;
  cursor:pointer;
}

button:hover{
  background:#145a18;
}

/* POPUP */
.popup{
  padding:15px;
  border-radius:10px;
  margin-top:10px;
}

.popup.green{
  background:#00c853;
  color:#000;
}

.popup.red{
  background:#d50000;
  color:#fff;
}

/* SCANNER */
.scanner-box{
  margin-top:20px;
  padding:15px;
  background:#fff;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.scanner-app{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  display:none;
  flex-direction:column;
  align-items:center;
  padding-top:20px;
}

.camera-box{
  width:300px;
  margin-top:20px;
}

.scan-result{
  margin-top:20px;
  background:#111;
  padding:15px;
  width:90%;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

  <!-- 🏛️ HEADER -->
  <div class="header">

    <!-- LOGO LEFT ONLY -->
    <div class="logo-box">
      <input type="file" onchange="loadLogo(event)">
      <img id="logoPreview">
    </div>

    <!-- TAMIL PARTY NAME ONLY -->
    <div class="title">
      <h2>தமிழ்நாடு மக்கள் நல்வாழ்வு பேரியக்கம்</h2>
      <p><b>ECI Regn No:</b> 56/219/2018-2021</p>
    </div>

  </div>

  <!-- ⚙️ AUTOFILL -->
  <div>
    <h3>⚙️ Autofill Settings</h3>

    <input id="default_voter" placeholder="Default Voter ID">
    <input id="default_mobile" placeholder="Default Mobile">
    <input id="default_email" placeholder="Default Email">

    <button onclick="saveDefaults()">💾 Save Defaults</button>
  </div>

  <!-- 📝 FORM -->
  <form id="registerForm">

    <input id="voterid"
           placeholder="Voter ID *"
           oninput="checkAutoFill(this.value)"
           required>

    <input id="phone" placeholder="Mobile Number *" required>

    <input id="email" placeholder="Gmail ID *" required>

    <button type="submit">Register Member</button>

  </form>

  <!-- REGISTER RESULT -->
  <div id="ack"></div>

  <!-- 📷 SCANNER -->
  <div class="scanner-box">
    <h3>QR Scanner</h3>
    <div id="reader"></div>
    <div id="scanResult"></div>
  </div>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<!-- QR SCANNER -->
<script src="https://unpkg.com/html5-qrcode"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBJaHZfEyg4pID4jmPSyVxEbDhta4VY0kY",
  authDomain: "tnmnp-membership-system.firebaseapp.com",
  projectId: "tnmnp-membership-system",
  storageBucket: "tnmnp-membership-system.firebasestorage.app",
  messagingSenderId: "616857466202",
  appId: "1:616857466202:web:0fb4fae39e938ec0edef63"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* LOGO */
function loadLogo(e){
  document.getElementById("logoPreview").src =
  URL.createObjectURL(e.target.files[0]);
}

/* AUTOFILL */
function getDefaults(){
  return JSON.parse(localStorage.getItem("tnmnp_defaults")) || {};
}

function saveDefaults(){
  let data = {
    voter: default_voter.value,
    mobile: default_mobile.value,
    email: default_email.value
  };

  localStorage.setItem("tnmnp_defaults", JSON.stringify(data));
  alert("Saved ✔");
}

function checkAutoFill(val){

  let d = getDefaults();

  if(val.length > 0){
    voterid.value = d.voter || val;
    phone.value = d.mobile || "";
    email.value = d.email || "";
  }
}

/* REGISTER */
registerForm.addEventListener("submit", e=>{
  e.preventDefault();

  let regNo = "TNMNP-" + Date.now();

  db.collection("members").add({
    regNo,
    voterId: voterid.value,
    mobile: phone.value,
    email: email.value
  });

  ack.innerHTML = `<div class="popup green">✅ REGISTERED<br>${regNo}</div>`;
  registerForm.reset();
});

/* SCANNER */
let scanner;

function startScanner(){
  scanner = new Html5QrcodeScanner("reader",{fps:10,qrbox:250});
  scanner.render(onScanSuccess);
}
startScanner();

/* SCAN RESULT */
function onScanSuccess(text){

  let beep = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");
  beep.play();

  if(navigator.vibrate) navigator.vibrate(200);

  db.collection("members")
  .where("regNo","==",text)
  .get()
  .then(snap=>{

    if(snap.empty){
      scanResult.innerHTML = `<div class="popup red">❌ INVALID</div>`;
      return;
    }

    snap.forEach(doc=>{
      let d = doc.data();

      scanResult.innerHTML = `
        <div class="popup green">
          🏛️ VERIFIED<br><br>
          ${d.regNo}<br>
          ${d.voterId}<br>
          ${d.mobile}<br>
          ${d.email}
        </div>
      `;
    });

  });
}
</script>

</body>
</html>
