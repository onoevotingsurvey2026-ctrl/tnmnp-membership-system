<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMNP Membership System V3 FIX</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f2f2f2;
}

header{
background:#0b3d91;
color:#fff;
padding:20px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.container{
max-width:1000px;
margin:auto;
background:#fff;
padding:20px;
margin-top:20px;
border-radius:10px;
}

/* NAV */
.nav{
display:flex;
gap:10px;
margin-bottom:15px;
}

.nav button{
padding:10px;
border:none;
cursor:pointer;
border-radius:5px;
}

.active{background:#0b3d91;color:#fff;}
.inactive{background:#ddd;}

input{
width:100%;
padding:10px;
margin:6px 0;
}

button{
padding:10px;
border:none;
cursor:pointer;
border-radius:5px;
}

.btn-green{background:green;color:#fff;}
.btn-blue{background:#0b3d91;color:#fff;}

.card{
border:2px solid #0b3d91;
padding:15px;
margin-top:10px;
border-radius:10px;
}

.hidden{display:none;}

.map-box{
background:#eee;
padding:10px;
margin-top:10px;
}
</style>
</head>

<body>

<header>
TMNP Membership System
</header>

<div class="container">

<div class="nav">
<button class="active" onclick="showTab('register',event)">Register</button>
<button class="inactive" onclick="showTab('members',event)">Members</button>
<button class="inactive" onclick="showTab('reports',event)">Reports</button>
</div>

<!-- REGISTER -->
<div id="registerTab">

<h3>Membership Registration</h3>

<input id="name" placeholder="Name">
<input id="phone" placeholder="Phone">
<input id="voterid" placeholder="Voter ID">
<input id="email" placeholder="Email">
<input id="address" placeholder="Address">
<input id="district" placeholder="District">

<input type="file" id="photo">

<button class="btn-green" onclick="getLocation()">📍 Get Location</button>

<div class="map-box" id="mapBox">Location not added</div>

<button class="btn-blue" onclick="save()">Submit</button>

<h3>Membership Card</h3>
<div id="idCard"></div>

</div>

<!-- MEMBERS -->
<div id="membersTab" class="hidden">
<h3>Members</h3>
<div id="membersList"></div>
</div>

<!-- REPORTS -->
<div id="reportsTab" class="hidden">
<h3>Reports</h3>
<button class="btn-green" onclick="downloadPDF()">PDF</button>
<button class="btn-green" onclick="exportExcel()">Excel</button>
</div>

</div>

<script>

let data = JSON.parse(localStorage.getItem("tmnp") || "[]");
let currentLocation = null;

/* TAB FIX */
function showTab(tab, event){

registerTab.classList.add("hidden");
membersTab.classList.add("hidden");
reportsTab.classList.add("hidden");

document.querySelectorAll(".nav button").forEach(b=>{
b.classList.remove("active");
b.classList.add("inactive");
});

if(tab==="register") registerTab.classList.remove("hidden");
if(tab==="members") { membersTab.classList.remove("hidden"); renderMembers(); }
if(tab==="reports") reportsTab.classList.remove("hidden");

event.target.classList.add("active");
}

/* LOCATION */
function getLocation(){
navigator.geolocation.getCurrentPosition(pos=>{
currentLocation={
lat:pos.coords.latitude,
lng:pos.coords.longitude
};

mapBox.innerHTML =
"Lat: " + currentLocation.lat + "<br>Lng: " + currentLocation.lng;
});
}

/* SAVE FIXED */
function save(){

let file = document.getElementById("photo").files[0];

let name = document.getElementById("name").value;
let phone = document.getElementById("phone").value;

if(!name || !phone){
alert("Name & Phone required");
return;
}

let reader = new FileReader();

reader.onload = function(){

let member = {
id:"TMNP-"+Date.now(),
timestamp:new Date().toLocaleString(),
name:name,
phone:phone,
voterid:document.getElementById("voterid").value,
email:document.getElementById("email").value,
address:document.getElementById("address").value,
district:document.getElementById("district").value,
photo:reader.result,
location:currentLocation
};

data.push(member);
localStorage.setItem("tmnp", JSON.stringify(data));

renderCard(member);
resetForm();
};

if(file){
reader.readAsDataURL(file);
}else{
reader.onload();
}
}

/* CARD */
function renderCard(m){

document.getElementById("idCard").innerHTML = `
<div class="card">
<h3>TMNP MEMBERSHIP CARD</h3>
<p><b>ID:</b> ${m.id}</p>
<p><b>Name:</b> ${m.name}</p>
<p><b>Phone:</b> ${m.phone}</p>
<p><b>District:</b> ${m.district}</p>
<p><b>Time:</b> ${m.timestamp}</p>
</div>
`;
}

/* MEMBERS */
function renderMembers(){

let html = "";
data.forEach(m=>{
html += `
<div class="card">
<b>${m.name}</b><br>
${m.phone} - ${m.district}
</div>`;
});

document.getElementById("membersList").innerHTML = html || "No members";
}

/* RESET */
function resetForm(){
["name","phone","voterid","email","address","district"].forEach(id=>{
document.getElementById(id).value = "";
});

document.getElementById("photo").value = "";
document.getElementById("mapBox").innerHTML = "Location not added";
}

/* PDF */
function downloadPDF(){
window.print();
}

/* CSV */
function exportExcel(){

let rows = [["ID","Time","Name","Phone","VoterID","Email","Address","District","Lat","Lng"]];

data.forEach(d=>{
rows.push([
d.id,d.timestamp,d.name,d.phone,d.voterid,
d.email,d.address,d.district,
d.location?.lat||"",d.location?.lng||""
]);
});

let csv = rows.map(r=>r.join(",")).join("\n");

let blob = new Blob([csv],{type:"text/csv"});
let a = document.createElement("a");
a.href = URL.createObjectURL(blob);
a.download = "TMNP_REPORT.csv";
a.click();
}

</script>

</body>
</html>
