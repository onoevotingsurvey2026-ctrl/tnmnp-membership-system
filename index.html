Replace your existing index.html with this version.

```html
<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMNP Membership System V2</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f2f2f2;
}

.container{
max-width:1000px;
margin:auto;
background:#fff;
padding:20px;
margin-top:20px;
border-radius:10px;
}

header{
background:#0b3d91;
color:#fff;
padding:18px;
}

.header-box{
border:2px solid rgba(255,255,255,.25);
padding:15px;
border-radius:10px;
}

.top-row{
display:flex;
justify-content:space-between;
flex-wrap:wrap;
gap:10px;
}

.img-box{
text-align:center;
}

.img-box img{
width:85px;
height:85px;
object-fit:cover;
border-radius:8px;
border:2px solid #fff;
}

.title{
text-align:center;
}

input{
width:100%;
padding:10px;
margin:6px 0;
box-sizing:border-box;
}

button{
padding:10px;
border:none;
cursor:pointer;
border-radius:5px;
margin:5px 0;
}

.btn{
background:#0b3d91;
color:white;
}

.btn-green{
background:green;
color:white;
}

.map-box{
padding:10px;
background:#f5f5f5;
border-radius:8px;
margin-top:10px;
}

.card{
border:2px solid #0b3d91;
padding:20px;
border-radius:10px;
background:white;
margin-top:20px;
}

.member-img{
width:100px;
height:100px;
object-fit:cover;
}

</style>
</head>

<body>

<div class="container">

<h2>Membership Registration</h2>

<input id="name" placeholder="Name">

<input id="phone" placeholder="Phone">

<input id="voterid" placeholder="Voter ID">

<input id="email" placeholder="Email">

<input id="address" placeholder="Address">

<input id="district" placeholder="District">

<input type="file" id="photo">

<button class="btn-green" onclick="getLocation()">

Get Location

</button>

<div id="mapBox" class="map-box">

Location not added

</div>

<button class="btn" onclick="save()">

Submit

</button>

<h3>Membership Card</h3>

<div id="idCard"></div>

<button class="btn-green" onclick="downloadPDF()">

Download PDF

</button>

<button class="btn-green" onclick="exportExcel()">

Download Excel

</button>

</div>

<script>

let data=
JSON.parse(
localStorage.getItem("tmnp")
||"[]"
);

let currentLocation=null;

function getLocation(){

navigator.geolocation.getCurrentPosition(

pos=>{

currentLocation={

lat:pos.coords.latitude,

lng:pos.coords.longitude

};

mapBox.innerHTML=

"Lat:"+currentLocation.lat+

"<br>Lng:"+currentLocation.lng;

}

);

}

function save(){

let file=photo.files[0];

if(!name.value||!phone.value){

alert("Required");

return;

}

let reader=new FileReader();

reader.onload=function(){

let now=new Date();

let formattedTimestamp=

String(now.getDate()).padStart(2,'0')

+"/"

+

String(now.getMonth()+1).padStart(2,'0')

+"/"

+

now.getFullYear()

+

" "

+

now.toLocaleTimeString();

let member={

id:

"TMNP-"+Date.now(),

timestamp:

formattedTimestamp,

name:

name.value,

phone:

phone.value,

voterid:

voterid.value,

email:

email.value,

address:

address.value,

district:

district.value,

photo:

reader.result,

location:

currentLocation

};

data.push(member);

localStorage.setItem(

"tmnp",

JSON.stringify(data)

);

renderCard(member);

resetForm();

};

if(file){

reader.readAsDataURL(file);

}else{

reader.onload();

}

}

function renderCard(m){

idCard.innerHTML=

`

<div class="card">

<h2>

TMNP Membership Card

</h2>

<img class="member-img"

src="${m.photo||''}">

<p>ID : ${m.id}</p>

<p>Name : ${m.name}</p>

<p>Phone : ${m.phone}</p>

<p>District : ${m.district}</p>

<p>Timestamp : ${m.timestamp}</p>

</div>

`;

}

function downloadPDF(){

window.print();

}

function exportExcel(){

let rows=[];

rows.push([

"Membership ID",

"Datestamp",

"Name",

"Mobile No",

"Voter ID",

"Gmail ID",

"Address",

"District",

"Member Photo",

"Get Location"

]);

data.forEach(d=>{

let locationData="";

if(d.location){

locationData=

(d.location.lat||"")

+

","

+

(d.location.lng||"");

}

rows.push([

d.id,

d.timestamp,

d.name,

d.phone,

d.voterid,

d.email,

d.address,

d.district,

d.photo ?

"Photo Uploaded"

:

"",

locationData

]);

});

let csv=

rows.map(

r=>r.map(

x=>`"${x}"`

).join(",")

).join("\n");

let blob=

new Blob(

[csv],

{

type:

"text/csv"

}

);

let a=

document.createElement("a");

a.href=

URL.createObjectURL(blob);

a.download=

"TMNP_REPORT.csv";

a.click();

}

function resetForm(){

name.value="";

phone.value="";

voterid.value="";

email.value="";

address.value="";

district.value="";

photo.value="";

mapBox.innerHTML=

"Location not added";

}

</script>

</body>

</html>
```
