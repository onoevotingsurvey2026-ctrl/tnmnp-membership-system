<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMNP Membership System V3</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f2f2f2;
}

.container{
max-width:1000px;
margin:auto;
background:#fff;
padding:20px;
margin-top:20px;
border-radius:10px;
}

/* HEADER */
header{
background:#0b3d91;
color:#fff;
padding:18px;
}

.header-box{
border:2px solid rgba(255,255,255,.25);
padding:15px;
border-radius:10px;
}

/* NAV */
.nav{
display:flex;
gap:10px;
flex-wrap:wrap;
margin:10px 0;
}

.nav button{
padding:10px 15px;
border:none;
cursor:pointer;
border-radius:5px;
font-weight:bold;
}

.active{
background:#0b3d91;
color:#fff;
}

.inactive{
background:#ddd;
}

/* INPUT */
input{
width:100%;
padding:10px;
margin:6px 0;
box-sizing:border-box;
}

button{
padding:10px;
border:none;
cursor:pointer;
border-radius:5px;
margin:5px 0;
}

.btn-green{background:green;color:#fff;}
.btn-blue{background:#0b3d91;color:#fff;}

.map-box{
padding:10px;
background:#f5f5f5;
border-radius:8px;
margin-top:10px;
}

.card{
border:2px solid #0b3d91;
padding:20px;
margin-top:10px;
border-radius:10px;
background:#fff;
}

.member-img{
width:90px;
height:90px;
object-fit:cover;
border-radius:6px;
}

.hidden{display:none;}
</style>
</head>

<body>

<header>
<div class="header-box">
<h2>TMNP Membership System</h2>
</div>
</header>

<div class="container">

<!-- NAV -->
<div class="nav">
<button class="active" onclick="showTab('register')">Register</button>
<button class="inactive" onclick="showTab('members')">Members</button>
<button class="inactive" onclick="showTab('reports')">Reports</button>
</div>

<!-- REGISTER -->
<div id="registerTab">

<h3>Membership Registration</h3>

<input id="name" placeholder="Name">
<input id="phone" placeholder="Phone">
<input id="voterid" placeholder="Voter ID">
<input id="email" placeholder="Email">
<input id="address" placeholder="Address">
<input id="district" placeholder="District">
<input type="file" id="photo">

<button class="btn-green" onclick="getLocation()">📍 Get Location</button>

<div class="map-box" id="mapBox">Location not added</div>

<button class="btn-blue" onclick="save()">Submit</button>

<h3>Membership Card</h3>
<div id="idCard"></div>

</div>

<!-- MEMBERS -->
<div id="membersTab" class="hidden">
<h3>All Members</h3>
<div id="membersList"></div>
</div>

<!-- REPORTS -->
<div id="reportsTab" class="hidden">
<h3>Reports</h3>

<button class="btn-green" onclick="downloadPDF()">Download PDF</button>
<button class="btn-green" onclick="exportExcel()">Download Excel</button>
</div>

</div>

<script>

let data = JSON.parse(localStorage.getItem("tmnp") || "[]");
let currentLocation = null;

/* TAB SWITCH */
function showTab(tab){

document.getElementById("registerTab").classList.add("hidden");
document.getElementById("membersTab").classList.add("hidden");
document.getElementById("reportsTab").classList.add("hidden");

document.querySelectorAll(".nav button").forEach(b=>{
b.classList.remove("active");
b.classList.add("inactive");
});

if(tab==="register"){
registerTab.classList.remove("hidden");
}

if(tab==="members"){
membersTab.classList.remove("hidden");
renderMembers();
}

if(tab==="reports"){
reportsTab.classList.remove("hidden");
}

event.target.classList.add("active");
}

/* LOCATION */
function getLocation(){
navigator.geolocation.getCurrentPosition(pos=>{
currentLocation={
lat:pos.coords.latitude,
lng:pos.coords.longitude
};

mapBox.innerHTML =
`Lat: ${currentLocation.lat}<br>Lng: ${currentLocation.lng}`;
});
}

/* SAVE */
function save(){

let file = photo.files[0];

if(!name.value || !phone.value){
alert("Name & Phone required");
return;
}

let reader = new FileReader();

reader.onload = function(){

let member = {
id:"TMNP-"+Date.now(),
timestamp:new Date().toLocaleString(),
name:name.value,
phone:phone.value,
voterid:voterid.value,
email:email.value,
address:address.value,
district:district.value,
photo:reader.result || "",
location:currentLocation
};

data.push(member);
localStorage.setItem("tmnp", JSON.stringify(data));

renderCard(member);
resetForm();
};

if(file){
reader.readAsDataURL(file);
}else{
reader.onload();
}
}

/* CARD */
function renderCard(m){

idCard.innerHTML = `
<div class="card">
<h3>TMNP MEMBER CARD</h3>
<img class="member-img" src="${m.photo}">
<p><b>ID:</b> ${m.id}</p>
<p><b>Name:</b> ${m.name}</p>
<p><b>Phone:</b> ${m.phone}</p>
<p><b>District:</b> ${m.district}</p>
<p><b>Time:</b> ${m.timestamp}</p>
</div>
`;
}

/* MEMBERS LIST */
function renderMembers(){

let html = "";

data.forEach(m=>{
html += `
<div class="card">
<p><b>${m.name}</b> (${m.id})</p>
<p>${m.phone} | ${m.district}</p>
</div>
`;
});

membersList.innerHTML = html || "No members yet";
}

/* RESET */
function resetForm(){
["name","phone","voterid","email","address","district"]
.forEach(x=>document.getElementById(x).value="");

photo.value="";
mapBox.innerHTML="Location not added";
}

/* PDF */
function downloadPDF(){
window.print();
}

/* EXCEL */
function exportExcel(){

let rows = [["ID","Time","Name","Phone","VoterID","Email","Address","District","Lat","Lng"]];

data.forEach(d=>{
rows.push([
d.id,d.timestamp,d.name,d.phone,d.voterid,
d.email,d.address,d.district,
d.location?.lat||"",d.location?.lng||""
]);
});

let csv = rows.map(r=>r.join(",")).join("\n");

let blob = new Blob([csv],{type:"text/csv"});
let a = document.createElement("a");

a.href = URL.createObjectURL(blob);
a.download = "TMNP_REPORT.csv";
a.click();
}

</script>

</body>
</html>
