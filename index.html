<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<title>TMNP Membership Form</title>

<style>
body{
    margin:0;
    padding:20px;
    font-family:Arial;
    background:#f2f2f2;
}

.container{
    max-width:950px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

/* HEADER */
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:2px solid #000;
    padding-bottom:10px;
}

.left-logo,.right-photo{
    flex:0 0 120px;
}

.left-logo img,.right-photo img{
    width:120px;
    height:120px;
    object-fit:cover;
    border:1px solid #ccc;
    border-radius:8px;
}

.center-info{
    flex:1;
    text-align:center;
}

.eci-info{
    margin-top:8px;
    font-size:13px;
    color:#444;
}

/* FORM */
.form-section{
    margin-top:20px;
}

input,textarea{
    width:100%;
    padding:10px;
    margin:6px 0 12px;
    box-sizing:border-box;
}

.row{
    display:flex;
    gap:10px;
}

/* BUTTON */
button{
    padding:12px;
    width:100%;
    background:#2e7d32;
    color:white;
    border:none;
    cursor:pointer;
    font-size:16px;
}

#msg{
    margin-top:15px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<!-- HEADER -->
<div class="header">

    <div class="left-logo">
        <img id="logoPreview">
    </div>

    <div class="center-info">
        <h3>TMNP MEMBERSHIP FORM</h3>
        <div class="eci-info">
            Election Commission of India Registered Party
        </div>
    </div>

    <div class="right-photo">
        <img id="leaderPreview">
    </div>

</div>

<!-- FORM -->
<div class="form-section">

<form id="memberForm">

<textarea id="address" placeholder="Full Address"></textarea>

<div class="row">
    <input id="voter" placeholder="Voter ID">
    <input id="phone" placeholder="Mobile">
</div>

<input id="email" placeholder="Email">
<input id="eci" placeholder="ECI Reg No">

<button type="submit">Save / Submit</button>

</form>

<div id="msg"></div>

</div>

</div>

<!-- FIREBASE + JS -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js"></script>

<script>
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBJaHZfEyg4pID4jmPSyVxEbDhta4VY0kY",
  authDomain: "tnmnp-membership-system.firebaseapp.com",
  projectId: "tnmnp-membership-system",
  storageBucket: "tnmnp-membership-system.firebasestorage.app",
  messagingSenderId: "616857466202",
  appId: "1:616857466202:web:0fb4fae39e938ec0edef63",
  measurementId: "G-Q7RYMTMLC7"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

document.getElementById("memberForm").addEventListener("submit", function(e){
    e.preventDefault();

    let id = "TMNP" + Date.now();

    let data = {
        id:id,
        address:document.getElementById("address").value,
        phone:document.getElementById("phone").value,
        voter:document.getElementById("voter").value,
        email:document.getElementById("email").value,
        eci:document.getElementById("eci").value,
        status:"pending"
    };

    db.ref("members/"+id).set(data);

    document.getElementById("msg").innerHTML =
    "✅ Form Submitted Successfully<br>🆔 ID: "+id;

    let wa =
    "https://wa.me/?text="+encodeURIComponent("TMNP ID: "+id);

    window.open(wa,"_blank");

    this.reset();
});
</script>

</body>
</html>
