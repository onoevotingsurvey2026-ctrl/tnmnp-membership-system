<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMNP Membership</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f2f2f2;
}

/* LOGO LEFT TOP */
.fixed-logo{
  position:fixed;
  top:10px;
  left:10px;
  width:85px;
  height:85px;
  object-fit:cover;
  border-radius:10px;
  border:2px solid #000;
  z-index:1000;
}

/* LEADER RIGHT TOP */
.fixed-leader{
  position:fixed;
  top:10px;
  right:10px;
  width:85px;
  height:85px;
  object-fit:cover;
  border-radius:10px;
  border:2px solid #000;
  z-index:1000;
}

.container{
  margin-top:120px;
  text-align:center;
}
</style>
</head>

<body>

<!-- EMBEDDED IMAGES -->
<img class="fixed-logo" src="logo.png" alt="Party Logo">
<img class="fixed-leader" src="leader.jpg" alt="Leader Image">

<div class="container">
  <h2>TMNP Membership Form</h2>
</div>

</body>
</html>
