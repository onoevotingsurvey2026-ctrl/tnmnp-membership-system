<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMNP Membership System</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f2f2f2;
}

header{
background:#0b3d91;
color:white;
padding:15px;
}

.header-row{
display:flex;
justify-content:space-between;
align-items:center;
}

.logo,.leader{
height:70px;
border-radius:8px;
}

.title{
text-align:center;
flex:1;
}

.container{
max-width:1000px;
margin:auto;
background:white;
padding:20px;
margin-top:20px;
border-radius:10px;
}

input{
width:100%;
padding:10px;
margin:6px 0;
}

button{
padding:10px;
margin:5px;
border:none;
cursor:pointer;
}

.btn{background:#0b3d91;color:white;}
.btn-danger{background:red;color:white;}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

th,td{
border:1px solid #ddd;
padding:8px;
text-align:center;
}

.member-img{
width:50px;
height:50px;
object-fit:cover;
border-radius:5px;
}

footer{
text-align:center;
padding:15px;
margin-top:20px;
background:#0b3d91;
color:white;
}
</style>
</head>

<body>

<header>
<div class="header-row">

<!-- BASE64 LOGO (replace if you want real permanent embed) -->
<img class="logo" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAAB..." />

<div class="title">
<h2>TMNP Membership System</h2>
<p>தமிழ்நாடு மக்கள் நல்வாழ்வு பேரியக்கம்</p>
<p>📧 tmnpofficial@gmail.com | 🌐 www.tmnp.org</p>
</div>

<!-- BASE64 LEADER IMAGE PLACEHOLDER -->
<img class="leader" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAAB..." />

</div>
</header>

<div class="container">

<h2>Membership Form</h2>

<input id="name" placeholder="Name">
<input id="phone" placeholder="Phone">
<input id="voterid" placeholder="Voter ID">
<input id="email" placeholder="Email">
<input id="address" placeholder="Address">
<input id="district" placeholder="District">
<input type="file" id="photo">

<button class="btn" onclick="save()">Submit</button>
<button class="btn-danger" onclick="clearAll()">Reset</button>
<button class="btn" onclick="downloadData()">Download Backup</button>

<h3>Dashboard</h3>

<table>
<thead>
<tr>
<th>ID</th>
<th>Photo</th>
<th>Name</th>
<th>Phone</th>
<th>Voter ID</th>
<th>Email</th>
<th>Address</th>
<th>District</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

</div>

<footer>© TMNP System</footer>

<script>

let data = JSON.parse(localStorage.getItem("tmnp") || "[]");

render();

function save(){

let name=document.getElementById("name").value;
let phone=document.getElementById("phone").value;
let voterid=document.getElementById("voterid").value;
let email=document.getElementById("email").value;
let address=document.getElementById("address").value;
let district=document.getElementById("district").value;
let file=document.getElementById("photo").files[0];

if(!name||!phone||!voterid){
alert("Fill required fields");
return;
}

let reader=new FileReader();

reader.onload=function(){

let obj={
id:"TMNP-"+Date.now(),
name,phone,voterid,email,address,district,
photo:reader.result
};

data.push(obj);
localStorage.setItem("tmnp",JSON.stringify(data));

render();
clearAll();
};

if(file){
reader.readAsDataURL(file);
}else{
reader.onload();
}
}

function render(){

let tbody=document.getElementById("tbody");
tbody.innerHTML="";

data.forEach(d=>{

tbody.innerHTML+=`
<tr>
<td>${d.id}</td>
<td><img class="member-img" src="${d.photo||''}"></td>
<td>${d.name}</td>
<td>${d.phone}</td>
<td>${d.voterid}</td>
<td>${d.email}</td>
<td>${d.address}</td>
<td>${d.district}</td>
</tr>`;
});
}

function clearAll(){
["name","phone","voterid","email","address","district"].forEach(id=>{
document.getElementById(id).value="";
});
document.getElementById("photo").value="";
}

function downloadData(){
let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="tmnp_members.json";
a.click();
}

</script>

</body>
</html>
