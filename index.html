<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<title>TMNP Membership System</title>

<style>
body{
    margin:0;
    padding:20px;
    font-family:Arial;
    background:#f2f2f2;
}

.container{
    max-width:1000px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

/* HEADER */
.header{
    display:flex;
    justify-content:space-between;
    border-bottom:2px solid #000;
    padding-bottom:10px;
}

.box img{
    width:120px;
    height:120px;
    object-fit:cover;
    border:1px solid #ccc;
}

/* FORM */
input,textarea{
    width:100%;
    padding:10px;
    margin:6px 0 12px;
    box-sizing:border-box;
}

.row{
    display:flex;
    gap:10px;
}

.section-title{
    margin-top:20px;
    font-weight:bold;
    color:#2e7d32;
}

/* BUTTON */
button{
    width:100%;
    padding:12px;
    background:#2e7d32;
    color:white;
    border:none;
    font-size:16px;
    cursor:pointer;
    border-radius:6px;
}

#msg{
    margin-top:15px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<!-- HEADER -->
<div class="header">

    <div class="box">
        <img id="logoPreview">
        <input type="file" onchange="loadLogo(event)">
    </div>

    <div style="text-align:center;">
        <h2>TMNP - Tamilnadu Makkal Nalvazhvu Periyakkam</h2>
        <p>ECI Registered Political Party</p>
        <p><b>Leader: N RAMAN</b></p>
        <p>ECI Reg No: 56/219/2018-2021</p>
    </div>

    <div class="box">
        <img id="leaderPreview">
        <input type="file" onchange="loadLeader(event)">
    </div>

</div>

<!-- FORM -->
<form id="memberForm">

<div class="section-title">MEMBER DETAILS</div>

<input id="name" placeholder="Full Name">
<input id="address" placeholder="Full Address">

<div class="row">
    <input id="voter" placeholder="Voter ID">
    <input id="phone" placeholder="Mobile">
</div>

<input id="email" placeholder="Gmail ID">

<div class="section-title">MEMBER PHOTO</div>
<input type="file" onchange="loadPhoto(event)">
<img id="photoPreview" style="width:120px;height:140px;object-fit:cover;border:1px solid #000;">

<div class="section-title">DECLARATION</div>

<p>
<input type="checkbox" required>
I agree Membership Declaration
</p>

<p>
<input type="checkbox" required>
I agree Party Rules & Declaration
</p>

<button type="submit">SAVE / SUBMIT</button>

</form>

<div id="msg"></div>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js"></script>

<script>
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  databaseURL: "https://YOUR_PROJECT.firebaseio.com",
  projectId: "YOUR_PROJECT"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* IMAGE UPLOAD */
function loadLogo(e){
    document.getElementById("logoPreview").src =
    URL.createObjectURL(e.target.files[0]);
}

function loadLeader(e){
    document.getElementById("leaderPreview").src =
    URL.createObjectURL(e.target.files[0]);
}

function loadPhoto(e){
    document.getElementById("photoPreview").src =
    URL.createObjectURL(e.target.files[0]);
}

/* SUBMIT */
document.getElementById("memberForm").addEventListener("submit", function(e){
    e.preventDefault();

    let id = "TMNP" + Date.now();

    let data = {
        id:id,
        name:document.getElementById("name").value,
        address:document.getElementById("address").value,
        voter:document.getElementById("voter").value,
        phone:document.getElementById("phone").value,
        email:document.getElementById("email").value,
        status:"pending"
    };

    db.ref("members/"+id).set(data);

    document.getElementById("msg").innerHTML =
    "✅ Form Submitted Successfully<br>🆔 ID: "+id;

    let wa =
    "https://wa.me/?text="+encodeURIComponent("TMNP ID: "+id);

    window.open(wa,"_blank");

    this.reset();
});
</script>

</body>
</html>
