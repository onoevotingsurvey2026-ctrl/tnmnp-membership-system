<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<title>TNMNP Membership System</title>
<link rel="stylesheet" href="style.css">

<style>
/* ⚙️ AUTOFILL PANEL */
.box{
  background:#fff;
  padding:15px;
  margin:10px 0;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.popup{
  padding:20px;
  border-radius:12px;
  margin-top:20px;
  text-align:center;
  font-weight:bold;
  animation:fadeIn 0.4s ease-in;
}

.popup.green{
  background:#00ff66;
  color:#000;
}

.popup.red{
  background:#ff3b3b;
  color:#fff;
}

@keyframes fadeIn{
  from{opacity:0; transform:scale(0.9);}
  to{opacity:1; transform:scale(1);}
}
</style>
</head>

<body>

<div class="container">

<!-- 🏛️ PARTY HEADER -->
<div class="box">
  <h2>TNMNP - Tamilnadu Makkal Nalvazhvu Periyakkam</h2>
  <h3>தமிழ்நாடு மக்கள் நல்வாழ்வு பேரியக்கம்</h3>
  <p><b>Leader:</b> N RAMAN</p>
  <p>“People First | Transparency | Development | Equality”</p>
</div>

<!-- ⚙️ SETTINGS PANEL -->
<div class="box">
  <h3>⚙️ Autofill Settings</h3>

  <input type="text" id="default_voter" placeholder="Default Voter ID">
  <input type="text" id="default_mobile" placeholder="Default Mobile">
  <input type="email" id="default_email" placeholder="Default Email">

  <button type="button" onclick="saveDefaults()">💾 Save Defaults</button>
</div>

<!-- 📝 FORM -->
<form id="registerForm">

  <input type="text" id="voterid"
         placeholder="Voter ID *"
         oninput="checkAutoFill(this.value)"
         required>

  <input type="tel" id="phone" placeholder="Mobile Number *" required>

  <input type="email" id="email" placeholder="Gmail ID *" required>

  <button type="submit">Register Member</button>
</form>

<!-- ⚡ ACK -->
<div id="ack"></div>

<!-- 📷 SCANNER -->
<div class="scanner-box">
  <h3>QR Scanner</h3>
  <div id="reader"></div>
  <div id="scanResult"></div>
</div>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<!-- QR -->
<script src="https://unpkg.com/html5-qrcode"></script>

<script>
/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyBJaHZfEyg4pID4jmPSyVxEbDhta4VY0kY",
  authDomain: "tnmnp-membership-system.firebaseapp.com",
  projectId: "tnmnp-membership-system",
  storageBucket: "tnmnp-membership-system.firebasestorage.app",
  messagingSenderId: "616857466202",
  appId: "1:616857466202:web:0fb4fae39e938ec0edef63"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ================= AUTO FILL STORAGE ================= */
function saveDefaults(){
  localStorage.setItem("voter", document.getElementById("default_voter").value);
  localStorage.setItem("mobile", document.getElementById("default_mobile").value);
  localStorage.setItem("email", document.getElementById("default_email").value);

  alert("Defaults Saved ✔");
}

/* ================= AUTO FILL LOGIC ================= */
function checkAutoFill(value){

  if(value.length > 0){
    document.getElementById("voterid").value =
      localStorage.getItem("voter") || value;

    document.getElementById("phone").value =
      localStorage.getItem("mobile") || "";

    document.getElementById("email").value =
      localStorage.getItem("email") || "";
  }
}

/* ================= FORM SUBMIT ================= */
document.getElementById("registerForm").addEventListener("submit", function(e){
  e.preventDefault();

  let regNo = "TNMNP-" + Date.now();

  db.collection("members").add({
    regNo: regNo,
    voterId: document.getElementById("voterid").value,
    mobile: document.getElementById("phone").value,
    email: document.getElementById("email").value
  });

  document.getElementById("ack").innerHTML =
  `<div class="popup green">✅ REGISTERED<br>${regNo}</div>`;

  this.reset();
});

/* ================= SCANNER ================= */
let scanner;

function startScanner(){
  scanner = new Html5QrcodeScanner("reader",
    { fps: 10, qrbox: 250 });

  scanner.render(onScanSuccess);
}

startScanner();

/* ================= SCAN RESULT ================= */
function onScanSuccess(decodedText){

  let beep = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");
  beep.play();

  if(navigator.vibrate) navigator.vibrate(200);

  db.collection("members")
  .where("regNo","==",decodedText)
  .get()
  .then(snap => {

    let r = document.getElementById("scanResult");

    if(snap.empty){
      r.innerHTML = `<div class="popup red">❌ INVALID MEMBER</div>`;
      return;
    }

    snap.forEach(doc => {
      let d = doc.data();

      r.innerHTML = `
        <div class="popup green">
          🏛️ VERIFIED MEMBER<br><br>
          Reg No: ${d.regNo}<br>
          Voter: ${d.voterId}<br>
          Mobile: ${d.mobile}<br>
          Email: ${d.email}<br><br>
          STATUS: ACTIVE
        </div>
      `;
    });

  });
}
</script>

</body>
</html>
