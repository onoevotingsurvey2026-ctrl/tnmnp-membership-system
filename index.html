<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMNP Membership System</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f2f2f2;
}

header{
background:#0b3d91;
color:white;
padding:15px;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
height:60px;
}

.container{
max-width:1000px;
margin:auto;
background:white;
padding:20px;
margin-top:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h2{
text-align:center;
}

input, select{
width:100%;
padding:10px;
margin:8px 0;
}

button{
padding:10px;
margin:5px;
border:none;
cursor:pointer;
}

.btn{
background:#0b3d91;
color:white;
}

.btn-danger{
background:red;
color:white;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

table, th, td{
border:1px solid #ddd;
}

th, td{
padding:10px;
text-align:center;
}

footer{
text-align:center;
padding:15px;
margin-top:20px;
background:#0b3d91;
color:white;
}

.flex{
display:flex;
gap:20px;
align-items:center;
justify-content:space-between;
}

.leader{
height:80px;
border-radius:10px;
}
</style>
</head>

<body>

<!-- HEADER -->
<header>
<img src="logo.png" class="logo" alt="Logo">

<div>
<h3>TMNP Membership System</h3>
<p>தமிழ்நாடு மக்கள் நல்வாழ்வு பேரியக்கம்</p>
</div>

<img src="leader.jpg" class="leader" alt="Leader">
</header>

<!-- FORM -->
<div class="container">

<h2>Membership Registration Form</h2>

<input type="text" id="name" placeholder="Full Name">
<input type="text" id="phone" placeholder="Phone Number">
<input type="email" id="email" placeholder="Email">
<input type="text" id="address" placeholder="Address">
<input type="text" id="district" placeholder="District">

<button class="btn" onclick="register()">Submit</button>
<button class="btn-danger" onclick="resetForm()">Reset</button>

<h3>Dashboard</h3>

<table id="table">
<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Phone</th>
<th>Email</th>
<th>Address</th>
<th>District</th>
</tr>
</thead>
<tbody></tbody>
</table>

</div>

<!-- FOOTER -->
<footer>
© 2026 TMNP Membership System
</footer>

<script>

let idCounter = 1000;

function register(){

let name = document.getElementById("name").value;
let phone = document.getElementById("phone").value;
let email = document.getElementById("email").value;
let address = document.getElementById("address").value;
let district = document.getElementById("district").value;

if(name=="" || phone==""){
alert("Please fill required fields");
return;
}

idCounter++;

let table = document.getElementById("table").getElementsByTagName('tbody')[0];

let row = table.insertRow();

row.innerHTML = `
<td>TMNP-${idCounter}</td>
<td>${name}</td>
<td>${phone}</td>
<td>${email}</td>
<td>${address}</td>
<td>${district}</td>
`;

document.getElementById("name").value="";
document.getElementById("phone").value="";
document.getElementById("email").value="";
document.getElementById("address").value="";
document.getElementById("district").value="";
}

function resetForm(){
document.getElementById("name").value="";
document.getElementById("phone").value="";
document.getElementById("email").value="";
document.getElementById("address").value="";
document.getElementById("district").value="";
}

</script>

</body>
</html>
