<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMNP Membership System</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f2f2f2;
}

/* HEADER */
header{
background:#0b3d91;
color:white;
padding:15px;
}

.header-row{
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
}

.logo{height:70px;}
.leader{height:80px;border-radius:10px;}

.title-box{
text-align:center;
flex:1;
}

.contact-bar{
margin-top:10px;
font-size:13px;
text-align:center;
line-height:1.6;
}

/* CONTAINER */
.container{
max-width:1000px;
margin:auto;
background:white;
padding:20px;
margin-top:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input{
width:100%;
padding:10px;
margin:8px 0;
}

button{
padding:10px;
margin:5px;
border:none;
cursor:pointer;
}

.btn{background:#0b3d91;color:white;}
.btn-danger{background:red;color:white;}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th, td{
border:1px solid #ddd;
padding:10px;
text-align:center;
}

footer{
text-align:center;
padding:15px;
margin-top:20px;
background:#0b3d91;
color:white;
}
</style>
</head>

<body>

<!-- HEADER -->
<header>
<div class="header-row">

<img src="logo.png" class="logo">

<div class="title-box">
<h2>TMNP Membership System</h2>
<p>தமிழ்நாடு மக்கள் நல்வாழ்வு பேரியக்கம்</p>
</div>

<img src="leader.jpg" class="leader">

</div>

<div class="contact-bar">
📍 Party Office: No.9, 2nd Cross Street, Gomathipuram, Thirunindravur<br>
📧 Email: tmnpofficial@gmail.com | 🌐 www.tmnp.org
</div>
</header>

<!-- FORM -->
<div class="container">

<h2>Membership Registration</h2>

<input type="text" id="name" placeholder="Full Name">
<input type="text" id="phone" placeholder="Phone Number">
<input type="text" id="voterid" placeholder="Voter ID Number">
<input type="email" id="email" placeholder="Email">
<input type="text" id="address" placeholder="Address">
<input type="text" id="district" placeholder="District">

<button class="btn" onclick="register()">Submit</button>
<button class="btn-danger" onclick="resetForm()">Reset</button>

<h3>Dashboard</h3>

<table id="table">
<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Phone</th>
<th>Voter ID</th>
<th>Email</th>
<th>Address</th>
<th>District</th>
</tr>
</thead>
<tbody></tbody>
</table>

</div>

<footer>
© 2026 TMNP Membership System
</footer>

<script>

let idCounter = 1000;

function register(){

let name = document.getElementById("name").value;
let phone = document.getElementById("phone").value;
let voterid = document.getElementById("voterid").value;
let email = document.getElementById("email").value;
let address = document.getElementById("address").value;
let district = document.getElementById("district").value;

if(name=="" || phone=="" || voterid==""){
alert("Please fill required fields");
return;
}

idCounter++;

let table = document.getElementById("table").getElementsByTagName('tbody')[0];

let row = table.insertRow();

row.innerHTML = `
<td>TMNP-${idCounter}</td>
<td>${name}</td>
<td>${phone}</td>
<td>${voterid}</td>
<td>${email}</td>
<td>${address}</td>
<td>${district}</td>
`;

resetForm();
}

function resetForm(){
document.getElementById("name").value="";
document.getElementById("phone").value="";
document.getElementById("voterid").value="";
document.getElementById("email").value="";
document.getElementById("address").value="";
document.getElementById("district").value="";
}

</script>

</body>
</html>
