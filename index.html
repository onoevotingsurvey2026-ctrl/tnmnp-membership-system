<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TMNP Membership Form</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<div class="header">

<div class="left-logo">
<img id="logoPreview">
<input type="file" accept="image/*" onchange="loadLogo(event)">
</div>

<div class="center-info">
<h2>TMNP Membership Registration</h2>

<input id="regId" readonly>

<input id="name" placeholder="Member Name">

<div class="row">
<input id="phone" placeholder="Mobile">
<input id="voter" placeholder="Voter ID">
</div>

<input id="email" placeholder="Email">
<textarea id="address" placeholder="Address"></textarea>

<input id="photo" type="file" accept="image/*">

<button onclick="submitMembership()">Submit</button>
</div>

<div class="right-photo">
<img id="leaderPreview">
<input type="file" accept="image/*" onchange="loadLeader(event)">
</div>

</div>

</div>

<script type="module" src="script.js"></script>
</body>
</html>
