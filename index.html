<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMNP Membership System</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f3f3f3;
}

/* GOLD HEADER */
header{
background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b);
color:#000;
padding:15px;
text-align:center;
border-bottom:5px solid #8b6508;
}

.header-title{
font-size:20px;
font-weight:900;
}

.party-ta{
font-size:16px;
font-weight:bold;
}

.leader{
font-size:13px;
margin-top:5px;
}

.location{
font-size:12px;
margin-top:5px;
}

/* CONTAINER */
.container{
max-width:1100px;
margin:auto;
padding:20px;
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

/* FORM */
.form-box{
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

input{
width:100%;
padding:10px;
margin:6px 0;
border:1px solid #ccc;
border-radius:5px;
}

button{
padding:10px;
border:none;
cursor:pointer;
border-radius:5px;
}

.btn{
background:#b8860b;
color:#fff;
width:100%;
}

.btn-green{
background:green;
color:#fff;
width:100%;
}

/* CARD */
.card{
background:#fff;
border-radius:15px;
overflow:hidden;
box-shadow:0 8px 20px rgba(0,0,0,0.2);
border-top:8px solid #b8860b;
width:350px;
}

.card-header{
background:linear-gradient(90deg,#b8860b,#ffd700,#b8860b);
color:#000;
text-align:center;
padding:10px;
font-weight:900;
}

.card-body{
padding:15px;
text-align:center;
}

.card img{
width:90px;
height:90px;
border-radius:50%;
object-fit:cover;
border:3px solid #b8860b;
margin-bottom:10px;
}

.badge{
background:#b8860b;
color:#fff;
padding:5px 10px;
display:inline-block;
border-radius:5px;
font-size:12px;
margin:5px 0;
}

.small{
font-size:13px;
margin:3px 0;
}

.location-box{
font-size:12px;
color:#444;
margin-top:5px;
}

/* LAYOUT */
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

</style>
</head>

<body>

<!-- HEADER -->
<header>
<div class="header-title">
TAMILNADU MAKKAL NALVAZHVU PERIYAKKAM
</div>

<div class="party-ta">
தமிழ்நாடு மக்கள் நல்வாழ்வு பேரியக்கம்
</div>

<div class="leader">
President / General Secretary : N. RAMAN
</div>

<div class="location" id="liveLoc">
📍 Location: Not Captured
</div>
</header>

<div class="container">

<!-- FORM -->
<div class="form-box">

<h3>Membership Registration</h3>

<input id="name" placeholder="Name">
<input id="phone" placeholder="Phone">
<input id="voterid" placeholder="Voter ID">
<input id="email" placeholder="Email">
<input id="address" placeholder="Address">
<input id="district" placeholder="District">
<input type="file" id="photo">

<button class="btn-green" onclick="getLocation()">📍 Get Location</button>

<button class="btn" onclick="save()">Submit</button>

</div>

<!-- CARD -->
<div class="grid">

<div id="cardArea"></div>

</div>

</div>

<script>

let data = JSON.parse(localStorage.getItem("tmnp") || "[]");
let currentLocation = null;

/* LOCATION */
function getLocation(){
navigator.geolocation.getCurrentPosition(pos=>{

currentLocation = {
lat: pos.coords.latitude,
lng: pos.coords.longitude
};

document.getElementById("liveLoc").innerHTML =
"📍 Location: " + currentLocation.lat + " , " + currentLocation.lng;
});
}

/* SAVE */
function save(){

let name = document.getElementById("name").value;
let phone = document.getElementById("phone").value;

if(!name || !phone){
alert("Name & Phone required");
return;
}

let file = document.getElementById("photo").files[0];
let reader = new FileReader();

reader.onload = function(){

let m = {
id:"TMNP-"+Date.now(),
name:name,
phone:phone,
voterid:document.getElementById("voterid").value,
email:document.getElementById("email").value,
address:document.getElementById("address").value,
district:document.getElementById("district").value,
photo:reader.result || "",
location:currentLocation
};

data.push(m);
localStorage.setItem("tmnp", JSON.stringify(data));

renderCard(m);
reset();
};

if(file){
reader.readAsDataURL(file);
}else{
reader.onload();
}
}

/* CARD */
function renderCard(m){

document.getElementById("cardArea").innerHTML = `
<div class="card">
<div class="card-header">
TMNP MEMBER CARD
</div>

<div class="card-body">

<img src="${m.photo || ''}">

<div class="badge">${m.id}</div>

<div class="small"><b>Name:</b> ${m.name}</div>
<div class="small"><b>Phone:</b> ${m.phone}</div>
<div class="small"><b>Voter ID:</b> ${m.voterid}</div>
<div class="small"><b>Address:</b> ${m.address}</div>
<div class="small"><b>District:</b> ${m.district}</div>

<div class="location-box">
<b>Latitude:</b> ${m.location?.lat || 'Not Found'}<br>
<b>Longitude:</b> ${m.location?.lng || 'Not Found'}
</div>

</div>
</div>
`;
}

/* RESET */
function reset(){
["name","phone","voterid","email","address","district"].forEach(id=>{
document.getElementById(id).value="";
});

document.getElementById("photo").value="";
}

</script>

</body>
</html>
