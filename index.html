<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMNP Membership System - ADMIN</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f2f2f2;
}

.container{
max-width:1000px;
margin:auto;
background:white;
padding:20px;
margin-top:20px;
border-radius:10px;
}

/* HEADER */
header{
background:#0b3d91;
color:white;
padding:18px;
}

.header-box{
border:2px solid rgba(255,255,255,0.25);
padding:15px;
border-radius:10px;
}

.top-row{
display:flex;
justify-content:space-between;
flex-wrap:wrap;
gap:10px;
margin-bottom:10px;
}

.img-box{
text-align:center;
}

.img-box img{
width:80px;
height:80px;
object-fit:cover;
border-radius:8px;
border:2px solid white;
}

.title{
text-align:center;
}

.slogan{
font-size:13px;
font-weight:700;
line-height:1.6;
}

.join{
font-size:14px;
font-weight:900;
color:#ff4d6d;
animation:blink 1.2s infinite;
}

@keyframes blink{
0%{opacity:1;}
50%{opacity:0.3;}
100%{opacity:1;}
}

/* LIVE */
.live-site{
color:#ffea00;
font-weight:900;
padding:3px 8px;
border:1px solid #ffea00;
border-radius:4px;
animation:liveBlink 1s infinite;
display:inline-block;
}

@keyframes liveBlink{
0%{opacity:1;}
50%{opacity:0.4;}
100%{opacity:1;}
}

/* INPUT */
input{
width:100%;
padding:10px;
margin:6px 0;
box-sizing:border-box;
}

button{
padding:10px;
margin:5px 0;
border:none;
cursor:pointer;
border-radius:5px;
}

.btn{background:#0b3d91;color:white;}
.btn-danger{background:red;color:white;}
.btn-green{background:green;color:white;}
.btn-admin{background:#222;color:#fff;}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

th,td{
border:1px solid #ddd;
padding:8px;
text-align:center;
font-size:13px;
}

.member-img{
width:50px;
height:50px;
object-fit:cover;
border-radius:5px;
}

.map-box{
margin-top:10px;
padding:10px;
background:#f5f5f5;
border-radius:8px;
font-size:13px;
}
</style>
</head>

<body>

<header>
<div class="header-box">

<div class="top-row">

<div class="img-box">
<img id="logoPreview">
<input type="file" onchange="loadLogo(event)">
<p>Logo</p>
</div>

<div class="img-box">
<img id="leaderPreview">
<input type="file" onchange="loadLeader(event)">
<p>Leader</p>
</div>

</div>

<div class="title">

<div class="slogan">
நேர்மை - நலன் - நம்பிக்கை<br>
மக்களுக்காக மக்களால்
</div>

<div class="join">"JOIN WITH US"</div>

<div>TMNP Membership System</div>

<div class="live-site">LIVE PORTAL</div>

</div>

</div>
</header>

<div class="container">

<h2>Membership Registration (ADMIN CONTROL)</h2>

<input id="name" placeholder="Name">
<input id="phone" placeholder="Phone">
<input id="voterid" placeholder="Voter ID">
<input id="email" placeholder="Email">
<input id="address" placeholder="Address">
<input id="district" placeholder="District">

<input type="file" id="photo">

<button class="btn-green" onclick="getLocation()">📍 Get Location</button>

<div class="map-box" id="mapBox">Location not added</div>

<button class="btn" onclick="save()">Submit</button>

<!-- 🔥 ADMIN RESET -->
<button class="btn-admin" onclick="adminReset()">🔐 ADMIN RESET</button>

<h3>Dashboard</h3>

<table>
<thead>
<tr>
<th>ID</th>
<th>Photo</th>
<th>Name</th>
<th>Phone</th>
<th>Voter ID</th>
<th>Email</th>
<th>Address</th>
<th>District</th>
<th>Map</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

</div>

<script>

let data = JSON.parse(localStorage.getItem("tmnp") || "[]");
let currentLocation=null;

render();

/* LOGO */
function loadLogo(e){
let r=new FileReader();
r.onload=()=>document.getElementById("logoPreview").src=r.result;
r.readAsDataURL(e.target.files[0]);
}

/* LEADER */
function loadLeader(e){
let r=new FileReader();
r.onload=()=>document.getElementById("leaderPreview").src=r.result;
r.readAsDataURL(e.target.files[0]);
}

/* LOCATION */
function getLocation(){
navigator.geolocation.getCurrentPosition(pos=>{
currentLocation={
lat:pos.coords.latitude,
lng:pos.coords.longitude
};

document.getElementById("mapBox").innerHTML=
`Lat:${currentLocation.lat}<br>
Lng:${currentLocation.lng}<br>
<a target="_blank" href="https://www.google.com/maps?q=${currentLocation.lat},${currentLocation.lng}">
Open Map</a>`;
});
}

/* SAVE */
function save(){

let name=document.getElementById("name").value;
let phone=document.getElementById("phone").value;
let voterid=document.getElementById("voterid").value;
let email=document.getElementById("email").value;
let address=document.getElementById("address").value;
let district=document.getElementById("district").value;
let file=document.getElementById("photo").files[0];

if(!name||!phone||!voterid){
alert("Fill required fields");
return;
}

let reader=new FileReader();

reader.onload=function(){

data.push({
id:"TMNP-"+Date.now(),
name,phone,voterid,email,address,district,
photo:reader.result,
location:currentLocation
});

localStorage.setItem("tmnp",JSON.stringify(data));
render();
resetForm();
};

reader.readAsDataURL(file);
}

/* RENDER */
function render(){
let tbody=document.getElementById("tbody");
tbody.innerHTML="";

data.forEach(d=>{
let map=d.location
? `<a target="_blank" href="https://www.google.com/maps?q=${d.location.lat},${d.location.lng}">View</a>`
: "No Map";

tbody.innerHTML+=`
<tr>
<td>${d.id}</td>
<td><img class="member-img" src="${d.photo}"></td>
<td>${d.name}</td>
<td>${d.phone}</td>
<td>${d.voterid}</td>
<td>${d.email}</td>
<td>${d.address}</td>
<td>${d.district}</td>
<td>${map}</td>
</tr>`;
});
}

/* NORMAL RESET */
function resetForm(){
["name","phone","voterid","email","address","district"].forEach(id=>{
document.getElementById(id).value="";
});
document.getElementById("photo").value="";
currentLocation=null;
document.getElementById("mapBox").innerHTML="Location not added";
}

/* 🔥 ADMIN RESET (PASSWORD + BACKUP) */
function adminReset(){

let pass = prompt("Enter ADMIN PASSWORD:");

if(pass !== "TMNP2026"){
alert("❌ Wrong Password!");
return;
}

if(!confirm("⚠ Are you sure? All data will be deleted + backup downloaded")){
return;
}

/* BACKUP */
let blob = new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
let url = URL.createObjectURL(blob);
let a = document.createElement("a");
a.href = url;
a.download = "TMNP_BACKUP.json";
a.click();

/* RESET DATA */
data=[];
localStorage.removeItem("tmnp");
render();
resetForm();

alert("✅ ADMIN RESET COMPLETED + BACKUP SAVED");
}

</script>

</body>
</html>
