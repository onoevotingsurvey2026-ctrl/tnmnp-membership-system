<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMNP Membership System V5</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f1f4f9;
}

/* HEADER DESIGN */
header{
background:#0b3d91;
color:#fff;
padding:20px;
text-align:center;
}

header h1{
margin:0;
font-size:22px;
}

header p{
margin:5px 0 0;
font-size:13px;
opacity:0.9;
}

/* CONTAINER */
.container{
max-width:1100px;
margin:auto;
padding:20px;
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

/* LEFT FORM */
.form-box{
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

input{
width:100%;
padding:10px;
margin:6px 0;
border:1px solid #ccc;
border-radius:5px;
}

button{
padding:10px;
border:none;
cursor:pointer;
border-radius:5px;
margin-top:8px;
}

.btn{
background:#0b3d91;
color:#fff;
width:100%;
}

.btn-green{
background:green;
color:#fff;
width:100%;
}

/* RIGHT CARD */
.card-box{
display:flex;
justify-content:center;
align-items:flex-start;
}

/* MEMBERSHIP CARD DESIGN */
.card{
width:320px;
background:#fff;
border-radius:15px;
overflow:hidden;
box-shadow:0 8px 20px rgba(0,0,0,0.15);
border-top:8px solid #0b3d91;
}

.card-header{
background:#0b3d91;
color:#fff;
padding:10px;
text-align:center;
font-weight:bold;
}

.card-body{
padding:15px;
text-align:center;
}

.card img{
width:90px;
height:90px;
border-radius:50%;
object-fit:cover;
border:3px solid #0b3d91;
margin-bottom:10px;
}

.card p{
margin:5px 0;
font-size:14px;
}

.badge{
background:#0b3d91;
color:#fff;
padding:5px 10px;
display:inline-block;
border-radius:5px;
font-size:12px;
margin-top:5px;
}

/* RESPONSIVE */
@media(max-width:900px){
.container{
grid-template-columns:1fr;
}
}
</style>
</head>

<body>

<header>
<h1>TAMILNADU MAKKAL NALVAZHVU PERIYAKKAM</h1>
<p>Membership Registration Portal</p>
</header>

<div class="container">

<!-- FORM -->
<div class="form-box">

<h3>Membership Registration</h3>

<input id="name" placeholder="Name">
<input id="phone" placeholder="Phone">
<input id="voterid" placeholder="Voter ID">
<input id="email" placeholder="Email">
<input id="address" placeholder="Address">
<input id="district" placeholder="District">
<input type="file" id="photo">

<button class="btn-green" onclick="save()">Submit</button>

</div>

<!-- CARD PREVIEW -->
<div class="card-box">

<div id="cardArea">
<div class="card">
<div class="card-header">TMNP MEMBER CARD</div>
<div class="card-body">
<p>No Data</p>
</div>
</div>
</div>

</div>

</div>

<script>

let data = JSON.parse(localStorage.getItem("tmnp") || "[]");

/* SAVE */
function save(){

let name = document.getElementById("name").value;
let phone = document.getElementById("phone").value;

if(!name || !phone){
alert("Name & Phone required");
return;
}

let file = document.getElementById("photo").files[0];
let reader = new FileReader();

reader.onload = function(){

let m = {
id:"TMNP-"+Date.now(),
name:name,
phone:phone,
voterid:document.getElementById("voterid").value,
email:document.getElementById("email").value,
address:document.getElementById("address").value,
district:document.getElementById("district").value,
photo:reader.result || ""
};

data.push(m);
localStorage.setItem("tmnp", JSON.stringify(data));

renderCard(m);
reset();
};

if(file){
reader.readAsDataURL(file);
}else{
reader.onload();
}
}

/* CARD DESIGN */
function renderCard(m){

document.getElementById("cardArea").innerHTML = `
<div class="card">
<div class="card-header">TMNP MEMBER CARD</div>

<div class="card-body">
<img src="${m.photo || ''}">
<div class="badge">${m.id}</div>

<p><b>Name:</b> ${m.name}</p>
<p><b>Phone:</b> ${m.phone}</p>
<p><b>Voter ID:</b> ${m.voterid}</p>
<p><b>District:</b> ${m.district}</p>
</div>

</div>
`;
}

/* RESET */
function reset(){
["name","phone","voterid","email","address","district"].forEach(id=>{
document.getElementById(id).value="";
});

document.getElementById("photo").value="";
}

</script>

</body>
</html>
