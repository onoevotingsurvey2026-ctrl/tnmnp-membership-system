<!DOCTYPE html>
<html>
<head>
  <title>TMNP Verify</title>
</head>

<body>

<h2>TMNP Verification</h2>

<div id="result">Loading...</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js"></script>

<script>
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBJaHZfEyg4pID4jmPSyVxEbDhta4VY0kY",
  authDomain: "tnmnp-membership-system.firebaseapp.com",
  projectId: "tnmnp-membership-system",
  storageBucket: "tnmnp-membership-system.firebasestorage.app",
  messagingSenderId: "616857466202",
  appId: "1:616857466202:web:0fb4fae39e938ec0edef63",
  measurementId: "G-Q7RYMTMLC7"
};

firebase.initializeApp(firebaseConfig);

let id = new URLSearchParams(window.location.search).get("id");

firebase.database().ref("members/" + id).once("value")
.then((snap) => {

    if(!snap.exists()){
        document.getElementById("result").innerHTML =
        "❌ NOT FOUND";
        return;
    }

    let m = snap.val();

    if(m.status === "approved"){
        document.getElementById("result").innerHTML =
        "✅ VALID MEMBER<br>ID: " + m.id +
        "<br>Name: " + m.name;
    }
    else if(m.status === "pending"){
        document.getElementById("result").innerHTML =
        "⏳ PENDING APPROVAL";
    }
    else{
        document.getElementById("result").innerHTML =
        "❌ REJECTED";
    }

});
</script>

</body>
</html>
