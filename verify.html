<!DOCTYPE html>

<html>

<head>

<title>

TMNP Verify

</title>

<meta charset="UTF-8">

<style>

body{

font-family:Arial;

padding:40px;

text-align:center;

}

.box{

max-width:500px;

margin:auto;

padding:20px;

border:1px solid #ccc;

border-radius:10px;

}

</style>

</head>

<body>

<div class="box">

<h2>

TMNP Member Verification

</h2>

<div id="result">

Checking...

</div>

</div>


<script>

let id=

new URLSearchParams(

window.location.search

).get("id");


if(!id){

document.getElementById(

"result"

).innerHTML=

"❌ Invalid Link";

}

else{

document.getElementById(

"result"

).innerHTML=

"✅ Member ID : "

+id+

"<br><br>Verification Ready";

}

</script>

</body>

</html>
