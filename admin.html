<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TMNP Admin Dashboard</title>

<style>
body{font-family:Arial;background:#f2f2f2;padding:20px;}
.container{max-width:900px;margin:auto;background:#fff;padding:20px;border-radius:10px;}
input,button{width:100%;padding:10px;margin:10px 0;}
button{background:#0b5ed7;color:#fff;border:none;cursor:pointer;}
table{width:100%;border-collapse:collapse;margin-top:20px;}
th,td{border:1px solid #ccc;padding:8px;text-align:left;}
#dashboard{display:none;}
</style>
</head>

<body>

<div class="container">

<h2>TMNP Admin Login</h2>

<div id="loginBox">
<input id="user" placeholder="Email ID">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<div id="dashboard">

<h3>Membership Records</h3>

<button onclick="downloadCSV()">Download CSV Report</button>

<table>
<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Mobile</th>
<th>Voter ID</th>
<th>Email</th>
</tr>
</thead>
<tbody id="dataBody"></tbody>
</table>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig={
apiKey:"AIzaSyBJaHZfEyg4pID4jmPSyVxEbDhta4VY0kY",
authDomain:"tnmnp-membership-system.firebaseapp.com",
databaseURL:"https://tnmnp-membership-system-default-rtdb.firebaseio.com",
projectId:"tnmnp-membership-system",
storageBucket:"tnmnp-membership-system.firebasestorage.app",
messagingSenderId:"616857466202",
appId:"1:616857466202:web:0fb4fae39e938ec0edef63"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

let allData=[];

/* 🔐 LOGIN */
window.login=function(){

const u=document.getElementById("user").value;
const p=document.getElementById("pass").value;

const validEmail="onoe.voting.survey2026@gmail.com";
const validPass="nraman131069";

if(u===validEmail && p===validPass){
document.getElementById("loginBox").style.display="none";
document.getElementById("dashboard").style.display="block";
loadData();
}else{
alert("Invalid Login");
}

}

/* 📥 LOAD DATA */
function loadData(){

get(ref(db,"members")).then(snapshot=>{

allData=[];
let html="";

snapshot.forEach(child=>{
const d=child.val();

allData.push({
id:d.id||"",
name:d.name||"",
mobile:d.mobile||"",
voter:d.voter||"",
email:d.email||""
});

html+=`
<tr>
<td>${d.id||""}</td>
<td>${d.name||""}</td>
<td>${d.mobile||""}</td>
<td>${d.voter||""}</td>
<td>${d.email||""}</td>
</tr>`;
});

document.getElementById("dataBody").innerHTML=html;

});

}

/* 📊 CSV DOWNLOAD */
window.downloadCSV=function(){

let csv="ID,Name,Mobile,Voter,Email\n";

allData.forEach(d=>{
csv+=`${d.id},${d.name},${d.mobile},${d.voter},${d.email}\n`;
});

const blob=new Blob([csv],{type:"text/csv"});
const url=URL.createObjectURL(blob);

const a=document.createElement("a");
a.href=url;
a.download="TMNP-membership-report.csv";
a.click();

}

</script>

</body>
</html>
