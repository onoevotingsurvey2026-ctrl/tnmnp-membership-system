<!DOCTYPE html>
<html>
<head>
<title>TMNP Admin</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h2>Admin Login</h2>

<div id="loginBox">
<input id="user" placeholder="Email">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<div id="dashboard" style="display:none">

<h3>Members</h3>

<button onclick="downloadCSV()">Download CSV</button>

<table>
<thead>
<tr>
<th>ID</th><th>Name</th><th>Mobile</th><th>Email</th>
</tr>
</thead>
<tbody id="dataBody"></tbody>
</table>

</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const app = initializeApp({
apiKey:"AIzaSyBJaHZfEyg4pID4jmPSyVxEbDhta4VY0kY",
databaseURL:"https://tnmnp-membership-system-default-rtdb.firebaseio.com",
projectId:"tnmnp-membership-system"
});

const db = getDatabase(app);

let allData = [];

/* LOGIN */
window.login = function(){
if(
document.getElementById("user").value==="onoe.voting.survey2026@gmail.com" &&
document.getElementById("pass").value==="nraman131069"
){
loginBox.style.display="none";
dashboard.style.display="block";
loadData();
}else alert("Invalid login");
};

/* REALTIME DATA */
function loadData(){
onValue(ref(db,"members"), snap=>{
allData=[];
let html="";

snap.forEach(s=>{
const d=s.val();
allData.push(d);

html += `
<tr>
<td>${d.id}</td>
<td>${d.name}</td>
<td>${d.mobile}</td>
<td>${d.email}</td>
</tr>`;
});

dataBody.innerHTML = html;
});
}

/* CSV ALL DATA */
window.downloadCSV = function(){

let csv="ID,Name,Mobile,Email\n";

allData.forEach(d=>{
csv+=`${d.id},${d.name},${d.mobile},${d.email}\n`;
});

const blob=new Blob([csv],{type:"text/csv"});
const a=document.createElement("a");

a.href=URL.createObjectURL(blob);
a.download="TMNP-Members.csv";
a.click();
};

</script>

</body>
</html>
