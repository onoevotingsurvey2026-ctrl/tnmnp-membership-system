<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>
</head>

<body>

<h2>Members Dashboard</h2>

<table border="1">
  <thead>
    <tr>
      <th>Membership ID</th>
      <th>Name</th>
      <th>Phone</th>
      <th>Email</th>
    </tr>
  </thead>

  <tbody id="memberTable"></tbody>
</table>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBJaHZfEyg4pID4jmPSyVxEbDhta4VY0kY",
  authDomain: "tnmnp-membership-system.firebaseapp.com",
  databaseURL: "https://tnmnp-membership-system-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "tnmnp-membership-system",
  storageBucket: "tnmnp-membership-system.firebasestorage.app",
  messagingSenderId: "616857466202",
  appId: "1:616857466202:web:0fb4fae39e938ec0edef63",
  measurementId: "G-Q7RYMTMLC7"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

db.ref("members").on("value", (snapshot) => {
  const data = snapshot.val();
  let html = "";

  for(let id in data){
    html += `
      <tr>
        <td>${data[id].membershipId}</td>
        <td>${data[id].name}</td>
        <td>${data[id].phone}</td>
        <td>${data[id].email}</td>
      </tr>
    `;
  }

  document.getElementById("memberTable").innerHTML = html;
});
</script>

</body>
</html>
