<!DOCTYPE html>

<html>

<head>

<title>

TMNP Admin

</title>

<style>

body{

font-family:Arial;

padding:20px;

}

.card{

border:1px solid #ccc;

padding:15px;

margin:10px 0;

}

</style>

</head>

<body>

<h2>

Members List

</h2>

<div id="members">

Loading...

</div>


<script type="module">

import {

initializeApp

}

from
"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {

getDatabase,

ref,

onValue

}

from
"https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";


const firebaseConfig={

apiKey:"AIzaSyBJaHZfEyg4pID4jmPSyVxEbDhta4VY0kY",

authDomain:"tnmnp-membership-system.firebaseapp.com",

databaseURL:
"https://tnmnp-membership-system-default-rtdb.firebaseio.com",

projectId:"tnmnp-membership-system",

storageBucket:
"tnmnp-membership-system.firebasestorage.app",

messagingSenderId:"616857466202",

appId:
"1:616857466202:web:0fb4fae39e938ec0edef63"

};


const app=

initializeApp(firebaseConfig);

const db=

getDatabase(app);


onValue(

ref(db,"members"),

(snapshot)=>{

let html="";

snapshot.forEach((x)=>{

let m=x.val();

html+=`

<div class="card">

<b>${m.id}</b>

<br>

${m.name}

<br>

${m.mobile}

<br>

${m.email}

</div>

`;

});

document
.getElementById("members")
.innerHTML=

html;

}

);

</script>

</body>

</html>
